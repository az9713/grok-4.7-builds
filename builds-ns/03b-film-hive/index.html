const ORDER = ['title','bee','waggle','hex','fan','swarm','scout','end'];
function hexCell(cx, cy, r) {
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 6 + k * TAU / 6;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function lay(id, tau) {
  const i = Math.max(0, ORDER.indexOf(id));
  const a0 = Math.floor(MASS.length * i / 8), b0 = Math.floor(MASS.length * (i + 1) / 8);
  for (let k = a0; k < b0; k++) {
    const p = MASS[k];
    const cx = 120 + (p[0] % 1680), cy = 80 + (p[1] % 920);
    hexCell(cx, cy, 8 + (p[2] % 10));
    ctx.strokeStyle = 'rgba(212,160,48,.35)'; ctx.lineWidth = 1; ctx.stroke();
    if (k % 17 === 0) { ctx.fillStyle = 'rgba(240,190,60,.15)'; ctx.fill(); }
  }
}
function bee(x, y, s, ang, flap) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.fillStyle = '#f2c14a'; ellipse(0, 0, 16, 8);
  ctx.fillStyle = '#1a140c'; ctx.fillRect(-6, -8, 3, 16); ctx.fillRect(2, -8, 3, 16);
  ctx.strokeStyle = 'rgba(230,236,255,.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-2, -6, 12, 5 + flap * 4, -0.4, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-2, 6, 12, 5 + flap * 4, 0.4, 0, TAU); ctx.stroke();
  ctx.restore();
}
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); ctx.fill(); }
function sTitle(tau) {
  ctx.fillStyle = lin(0, H, ['#1a1208', '#3a2810']); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f3e6c4'; ctx.textAlign = 'center'; ctx.globalAlpha = smooth(tau / 1.2);
  ctx.font = '200 96px ' + FONT; ctx.fillText('The Hive', 960, 300);
  ctx.font = '300 28px ' + FONT; ctx.fillText('one bee, then the comb', 960, 360);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  return { x: 960, y: 540 };
}
function sBee(tau) {
  ctx.fillStyle = '#24180c'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) { hexCell(960, 540, 40 + i * 36); ctx.strokeStyle = 'rgba(212,160,48,.25)'; ctx.stroke(); }
  const x = lerp(300, 960, easeOut(tau / 6)), y = 540 + Math.sin(tau * 3) * 20;
  bee(x, y, 2.2, Math.sin(tau) * 0.2, Math.abs(Math.sin(tau * 20)));
  caption('one bee', tau);
  return { x: x, y: y };
}
function sWaggle(tau) {
  ctx.fillStyle = '#2a1c10'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e2b04a'; ctx.lineWidth = 3; ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const u = i / 120, a = u * TAU * 2;
    const x = 960 + Math.sin(a) * 180, y = 540 + Math.sin(a * 2) * 80;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  const u = (tau * 0.25) % 1, a = u * TAU * 2;
  bee(960 + Math.sin(a) * 180, 540 + Math.sin(a * 2) * 80, 1.8, a, 1);
  caption('waggle', tau);
  return { x: 960, y: 540 };
}
function sHex(tau) {
  ctx.fillStyle = '#1a120a'; ctx.fillRect(0, 0, W, H);
  const R = 26, filled = Math.floor(easeOut(tau / 10) * 180);
  let n = 0;
  for (let row = -8; row <= 8; row++) for (let col = -14; col <= 14; col++) {
    const cx = 960 + col * R * 1.75 + (row % 2 ? R * 0.87 : 0);
    const cy = 540 + row * R * 1.5;
    hexCell(cx, cy, R * 0.92);
    ctx.strokeStyle = 'rgba(212,160,48,.45)'; ctx.stroke();
    if (n < filled) { ctx.fillStyle = n % 11 === 0 ? '#f0c14a' : 'rgba(180,120,40,.25)'; ctx.fill(); }
    n++;
  }
  caption('hex fill', tau);
  return { x: 960, y: 540 };
}
function sFan(tau) {
  ctx.fillStyle = '#20160e'; ctx.fillRect(0, 0, W, H);
  hexCell(960, 620, 220); ctx.fillStyle = '#3a2814'; ctx.fill(); ctx.strokeStyle = '#e2b04a'; ctx.lineWidth = 4; ctx.stroke();
  for (let i = 0; i < 7; i++) {
    const a = -0.8 + i * 0.26;
    bee(960 + Math.cos(a) * 120, 620 + Math.sin(a) * 40, 1.3, a + Math.PI, Math.abs(Math.sin(tau * 18 + i)));
  }
  caption('fanning', tau);
  return { x: 960, y: 620 };
}
function sSwarm(tau) {
  ctx.fillStyle = lin(0, H, ['#87a0c0', '#d7e2c8']); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#6a8a48'; ctx.fillRect(0, 820, W, 260);
  for (let i = 0; i < 80; i++) {
    const a = tau * 0.8 + i, r = 40 + (i % 10) * 28;
    bee(960 + Math.cos(a) * r, 460 + Math.sin(a * 1.3) * r * 0.6, 0.7, a, Math.abs(Math.sin(tau * 16 + i)));
  }
  caption('swarm', tau);
  return { x: 960, y: 460 };
}
function sScout(tau) {
  sSwarm(0.2);
  for (let i = 0; i < 5; i++) {
    const x = lerp(-100, 1700, (tau * 0.12 + i * 0.17) % 1);
    bee(x, 200 + i * 30, 1.1, 0.1, 1);
  }
  caption('scouts', tau);
  return { x: 1200, y: 280 };
}
function sEnd(tau) {
  ctx.fillStyle = '#1a1208'; ctx.fillRect(0, 0, W, H);
  hexCell(960, 500, 260); ctx.strokeStyle = '#e2b04a'; ctx.lineWidth = 3; ctx.stroke();
  bee(960, 500, 2, Math.sin(tau) * 0.3, Math.abs(Math.sin(tau * 12)));
  ctx.fillStyle = '#f3e6c4'; ctx.textAlign = 'center'; ctx.globalAlpha = smooth(tau / 1.2);
  ctx.font = '200 80px ' + FONT; ctx.fillText('The Hive', 960, 220);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  return { x: 960, y: 500 };
}
function caption(txt, tau) {
  const a = smooth((tau - 0.5) / 0.8) * (1 - smooth((tau - 10) / 0.8)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#f3e6c4'; ctx.font = '300 28px ' + FONT; ctx.fillText(txt, 80, 1000); ctx.restore();
}

const RAW = { title: sTitle, bee: sBee, waggle: sWaggle, hex: sHex, fan: sFan, swarm: sSwarm, scout: sScout, end: sEnd };
const DRAW = {};
for (const k in RAW) DRAW[k] = (tau) => { lay(k, tau); return RAW[k](tau); };
function render(t, c, ox, oy, sc) {
  ctx = c; c.save(); c.setTransform(sc, 0, 0, sc, ox, oy); c.beginPath(); c.rect(0, 0, W, H); c.clip();
  let i = 0; while (i < S.length - 1 && t >= S[i + 1].start) i++;
  const s = S[i]; c.save(); const bp = DRAW[s.id](t - s.start) || { x: W / 2, y: H / 2 }; c.restore();
  const n = S[i + 1];
  if (n && t > n.start - TR) {
    const r = easeInOut((t - (n.start - TR)) / TR) * 2300;
    c.save(); circle(bp.x, bp.y, r); c.clip(); c.save(); DRAW[n.id](t - n.start); c.restore(); c.restore();
    circle(bp.x, bp.y, r); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 5; c.stroke();
  }
  let fade = 0; if (t < .8) fade = 1 - t / .8; if (t > TOTAL - 2) fade = smooth((t - (TOTAL - 2)) / 2);
  if (fade > 0) { c.fillStyle = `rgba(7,8,11,${fade})`; c.fillRect(0, 0, W, H); }
  c.restore();
}
function fit() { const d = Math.min(2, window.devicePixelRatio || 1); canvas.width = Math.round(innerWidth * d); canvas.height = Math.round(innerHeight * d); }
function draw(t) {
  const c = canvas.getContext('2d'), cw = canvas.width, ch = canvas.height, sc = Math.min(cw / W, ch / H);
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#07080b'; c.fillRect(0, 0, cw, ch);
  render(t, c, (cw - W * sc) / 2, (ch - H * sc) / 2, sc);
}

/* ============================ PLAYBACK =========================== */
const ui = document.getElementById('ui'), btn = document.getElementById('play');
let ac = null, eng = null, t0 = 0, idx = 0, timer = 0, ended = false, still = .95;
const filmTime = () => ac ? ac.currentTime - t0 - (ac.outputLatency || 0) : still;
function pump() { const now = ac.currentTime - t0; while (idx < score.length && score[idx].t < now + 1.2) { const e = score[idx++]; eng.play(e, t0 + e.t); } }
function start() {
  if (ac) ac.close();
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  eng = Engine(ac); t0 = ac.currentTime + .3; idx = 0; ended = false;
  clearInterval(timer); timer = setInterval(pump, 50); pump(); ui.classList.add('hide');
}
function frame() {
  const t = filmTime(); draw(clamp(t, 0, TOTAL));
  if (ac && !ended && t > TOTAL + 1.5) { ended = true; clearInterval(timer); btn.textContent = 'Play again'; ui.classList.remove('hide'); }
  requestAnimationFrame(frame);
}

/* ============================ TEST MODES ========================= */
async function audioTest() {
  const sr = 44100, len = Math.ceil(sr * (TOTAL + 3)), oc = new OfflineAudioContext(2, len, sr), e = Engine(oc);
  // schedule the way live playback does: 1 s steps, 1.2 s lookahead
  let k = 0; const feed = now => { while (k < score.length && score[k].t < now + 1.2) { const n = score[k++]; e.play(n, n.t + .05); } };
  for (let tt = 1; tt < TOTAL + 2; tt++) oc.suspend(tt).then(() => { feed(tt); oc.resume(); });
  feed(0); const w0 = performance.now();
  const buf = await oc.startRendering(), renderSec = (performance.now() - w0) / 1000, L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, clip = 0; for (let i = 0; i < len; i++) { const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > peak) peak = a; if (a >= .999) clip++; }
  const rms = (a, b) => { let s = 0; const i0 = Math.floor(a * sr), i1 = Math.min(len, Math.floor(b * sr)); for (let i = i0; i < i1; i++) s += L[i] * L[i] + R[i] * R[i]; return Math.sqrt(s / (2 * (i1 - i0))); };
  const db = x => (20 * Math.log10(x)).toFixed(1);
  const out = { renderSec: +renderSec.toFixed(1), notes: score.length, byInst: score.reduce((o, n) => (o[n.inst] = (o[n.inst] || 0) + 1, o), {}), seconds: +(len / sr).toFixed(2),
    peak: +peak.toFixed(4), peakDb: db(peak), clippedSamples: clip, rmsDbAll: db(rms(0, TOTAL)),
    scenes: S.map(s => ({ id: s.id, from: s.start, to: s.start + s.dur, rmsDb: db(rms(s.start, s.start + s.dur)) })), tailRmsDb: db(rms(TOTAL, TOTAL + 3)) };
  document.body.innerHTML = '<pre id="result">' + JSON.stringify(out, null, 1) + '</pre>'; document.title = 'AUDIOTEST DONE';
}
function sheet() {
  const times = (new URLSearchParams(location.search).get('sheet') || '').split(',').filter(Boolean).map(Number);
  const T = times.length ? times : [3, 9, 13.5, 17.6, 21, 26, 32, 34.2, 40, 43.3, 47.4, 50, 57, 64, 68, 76, 80, 85];
  const cols = 4, cw = 480, chh = 270, rows = Math.ceil(T.length / cols);
  canvas.width = cols * cw; canvas.height = rows * (chh + 24); canvas.style.width = canvas.width + 'px'; canvas.style.height = canvas.height + 'px';
  document.body.style.overflow = 'visible'; ui.classList.add('hide');
  const c = canvas.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, canvas.width, canvas.height);
  T.forEach((t, k) => { const x = (k % cols) * cw, y = Math.floor(k / cols) * (chh + 24);
    render(t, c, x, y, cw / W); c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#fff'; c.font = `16px ${FONT}`; c.fillText('t = ' + t + ' s', x + 8, y + chh + 18); });
}

const Q = new URLSearchParams(location.search);
if (Q.has('audiotest')) { ui.classList.add('hide'); audioTest().catch(err => { document.body.innerHTML = '<pre id="result">ERROR ' + err + '</pre>'; }); }
else if (Q.has('sheet')) sheet();
else if (Q.has('t')) { ui.classList.add('hide'); const t = +Q.get('t'); fit(); draw(t); addEventListener('resize', () => { fit(); draw(t); }); }
else {
  fit(); addEventListener('resize', fit);
  btn.addEventListener('click', start);
  addEventListener('keydown', e => {
    if (e.code === 'Space' && ac) { e.preventDefault(); ac.state === 'running' ? ac.suspend() : ac.resume(); }
    if (e.key === 'r' || e.key === 'R') start();
  });
  requestAnimationFrame(frame);
}
</script>
