<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NORTH ATLANTIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
:root{--bg:#05090a;--ink:#c9d6ce;--mark:#7ea394;--dim:#6a7a74}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{display:grid;place-items:center;font-family:"Share Tech Mono",ui-monospace,monospace}
canvas{display:block}
#gate{position:fixed;inset:0;display:grid;place-content:center;gap:22px;justify-items:center;
  background:rgba(5,9,10,.74);border:0;color:var(--ink);cursor:pointer;font:inherit;
  letter-spacing:.32em;text-transform:uppercase;font-size:12px;padding:16px;text-align:center}
#gate[hidden]{display:none}
#gate .play{display:grid;place-items:center;width:84px;height:84px;border:1px solid var(--mark);border-radius:50%;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),background .4s}
#gate .play::before{content:"";margin-left:6px;border-left:18px solid var(--mark);border-top:11px solid transparent;border-bottom:11px solid transparent}
#gate:hover .play,#gate:focus-visible .play{transform:scale(1.08);background:rgba(126,163,148,.14)}
#gate:focus-visible{outline:none}
#gate .k{color:var(--dim)}
#gate .t{font-size:13px}
</style>
</head>
<body>
<canvas id="c" aria-label="Title sequence for a film called NORTH ATLANTIC"></canvas>
<button id="gate" type="button" hidden>
  <span class="t">A title sequence</span>
  <span class="play" aria-hidden="true"></span>
  <span class="k" id="gateHint">15 seconds &middot; sound on &middot; space to play</span>
</button>
<script>
"use strict";
const DW = 1920, DH = 803, CX = DW / 2, CY = DH / 2, DUR = 15;
const INK = '#c9d6ce', FOAM = '#d7e4dc', DIM = '#6a7a74', SEA = '#0c1c1a';
const STEN = '"Black Ops One", "Arial Black", sans-serif';
const MONO = '"Share Tech Mono", ui-monospace, monospace';
const TITLE = 'NORTH ATLANTIC';
const LINE = '61°12′ N   FORCE 8';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
let S = 1;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));

const eOutCubic = x => 1 - Math.pow(1 - x, 3);
function hash(a, b = 0) {

function setFont(spec) { ctx.font = spec; }
function spacedWidth(txt, ls) {

function spaced(txt, x, y, ls, align = 'left') {

}
const grains = [];
function buildGrain() {

function finish(t) {

    ctx.beginPath(); ctx.ellipse(hash(fr, 7) * DW, hash(fr, 8) * DH, 1 + hash(fr, 10) * 2.4, 0.7 + hash(fr, 11) * 1.5, hash(fr, 12) * 3, 0, 7);

function horizonY() { return DH * 0.438; }
function drawSky(t) {

}
function drawSea(t) {

  g.addColorStop(0, '#163430'); g.addColorStop(0.22, '#0f2624'); g.addColorStop(0.7, '#081616'); g.addColorStop(1, '#040a0a');

function wakePoint(u, t) {

function drawLight(t) {

function drawWhitecaps(t) {
