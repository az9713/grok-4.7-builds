  note('cello', bar, 2, 1.5, low[bar % 8] + 19, 0.28);
  note('drum', bar, 0, 0.4, 48, 0.7, { hit: true });
  if (bar % 2) note('drum', bar, 2.5, 0.3, 53, 0.4);
  if (bar >= 14 && bar < 22) note('drum', bar, 1.5, 0.25, 50, 0.55, { hit: true });

function impulse(ac, sec) {
  const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4); }
  return b;
}
function Engine(ac) {
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
  const rev = ac.createConvolver(); rev.buffer = impulse(ac, 2.2); const rv = ac.createGain(); rv.gain.value = 0.28; rev.connect(rv); rv.connect(master);
  const bus = ac.createGain(); bus.gain.value = 1; bus.connect(master); const send = ac.createGain(); send.gain.value = 0.35; bus.connect(send); send.connect(rev);

  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };

    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(cut || f * 6, t); lp.frequency.exponentialRampToValueAtTime(Math.max(80, f * 1.5), t + Math.min(0.6, dur));
    const g = ac.createGain(); env(g, t, 0.012, peak, dur);

    const g2 = ac.createGain(); env(g2, t, 0.01, peak * 0.35, Math.min(1.4, e.d));
    o2.connect(g2); g2.connect(bus); o2.start(t); o2.stop(t + e.d + 0.5);

    const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2;

    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;

const ORDER = ['title','cup','cracks','rain','braid','wall','remains','end'];
function lay(id, tau) {
  const i = Math.max(0, ORDER.indexOf(id));
  const a0 = Math.floor(MASS.length * i / 8), b0 = Math.floor(MASS.length * (i + 1) / 8);
  for (let k = a0; k < b0; k++) {
    const p = MASS[k];
    if (id === 'cracks' || id === 'remains') {
      ctx.strokeStyle = 'rgba(40,32,24,.7)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + p[2], p[1] + (k % 5) * 6); ctx.stroke();
    } else if (id === 'rain' || id === 'wall') {
      ctx.strokeStyle = 'rgba(180,200,220,.35)'; ctx.beginPath();
      ctx.moveTo(p[0], (p[1] + tau * 400) % H); ctx.lineTo(p[0] + 6, (p[1] + tau * 400) % H + 18); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(90,70,50,.35)';
      circle(p[0], 800 + (p[1] % 200), 2 + (p[2] % 4)); ctx.fill();
    }
  }
}
function cup(x, y, s, water) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#c5ccd0';
  ctx.beginPath(); ctx.moveTo(-50, -20); ctx.lineTo(-34, 50); ctx.lineTo(34, 50); ctx.lineTo(50, -20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a949c'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(62, 10, 22, -1, 1); ctx.stroke();
  if (water > 0) { ctx.fillStyle = 'rgba(80,140,170,.85)'; ctx.fillRect(-30, 20 - water * 30, 60, water * 30); }
  ctx.restore();
}
function ground(col) { ctx.fillStyle = col; ctx.fillRect(0, 640, W, H - 640); }
function sTitle(tau) {
  ctx.fillStyle = lin(0, H, ['#d7c4a4', '#c2a888']); ctx.fillRect(0, 0, W, H);
  ground('#a89070');
  cup(960, 700, 2.2, 0);
  ctx.fillStyle = '#3a2a1c'; ctx.textAlign = 'center'; ctx.globalAlpha = smooth(tau / 1.2);
  ctx.font = '200 96px ' + FONT; ctx.fillText('The Cup', 960, 280);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  return { x: 960, y: 640 };
}
function sCup(tau) {
  ctx.fillStyle = '#e4d2b4'; ctx.fillRect(0, 0, W, 640); ground('#b89a74');
  cup(960, 720, 2.4, smooth(tau / 8) * 0.2);
  caption('tin cup', tau);
  return { x: 960, y: 680 };
}
function sCracks(tau) {
  ctx.fillStyle = '#e6d6b8'; ctx.fillRect(0, 0, W, 640); ground('#c2a484');
  const grow = easeOut(tau / 8);
  ctx.strokeStyle = '#4a3a28'; ctx.lineWidth = 2;
  function branch(x, y, a, depth) {
    if (depth > 7 || y > 1000) return;
    const len = (40 + depth * 8) * grow;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
    if (depth > 2) branch(x2, y2, a - 0.5, depth + 1);
    if (hash(depth, x) > 0.4) branch(x2, y2, a + 0.6, depth + 1);
  }
  branch(960, 660, 1.4, 0); branch(960, 660, 1.8, 0);
  cup(1180, 760, 1.6, 0);
  caption('cracks', tau);
  return { x: 960, y: 700 };
}
function sRain(tau) {
  ctx.fillStyle = '#8aa0b0'; ctx.fillRect(0, 0, W, 640); ground('#8a7458');
  ctx.strokeStyle = 'rgba(230,240,246,.7)'; ctx.lineWidth = 2;
  for (let i = 0; i < 120; i++) {
    const y = (hash(i, 2) * H + tau * 700) % H, x = hash(i, 5) * W;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8, y + 22); ctx.stroke();
  }
  let level = 0;
  for (const e of score) if (e.hit && tau > e.t - S[3].start) level = Math.min(1, level + 0.04);
  cup(960, 740, 2.2, 0.3 + level);
  caption('rain', tau);
  return { x: 960, y: 700 };
}
function sBraid(tau) {
  ctx.fillStyle = '#c8b898'; ctx.fillRect(0, 0, W, H);
  for (let b = 0; b < 3; b++) {
    ctx.strokeStyle = b === 1 ? '#3a7a96' : '#2f6a84'; ctx.lineWidth = 34 - b * 6;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 16) {
      const y = 540 + Math.sin(x * 0.004 + b + tau * 0.2) * 80 + Math.sin(x * 0.01 + b * 2) * 36;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  cup(300, 800, 1.2, 1);
  caption('braided channels', tau);
  return { x: 960, y: 540 };
}
function sWall(tau) {
  ctx.fillStyle = '#6a7c88'; ctx.fillRect(0, 0, W, H);
  const h = lerp(H + 40, 180, easeOut(tau / 9));
  ctx.fillStyle = '#1e4e68';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, h + Math.sin(x * 0.02 + tau * 3) * 16);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(220,236,244,.45)';
  ctx.beginPath(); ctx.moveTo(0, h);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, h + Math.sin(x * 0.05 + tau * 4) * 10);
  ctx.stroke();
  if (h > 700) cup(960, 820, 1.4, 1);
  caption('wall of water', tau);
  return { x: 960, y: h };
}
function sRemains(tau) {
  ctx.fillStyle = lin(0, H, ['#d8d0c4', '#b7b0a4']); ctx.fillRect(0, 0, W, H);
  ground('#9a9078');
  ctx.fillStyle = 'rgba(70,110,130,.35)'; ctx.fillRect(0, 760, W, 80);
  cup(960, 700, 2.6, 0.15);
  ctx.strokeStyle = 'rgba(60,50,40,.45)';
  for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(200 + i * 40, 760); ctx.lineTo(960, 760); ctx.stroke(); }
  caption('the cup remains', tau);
  return { x: 960, y: 680 };
}
function sEnd(tau) {
  sRemains(tau);
  ctx.globalAlpha = smooth((tau - 1) / 1); ctx.fillStyle = '#2c2824'; ctx.textAlign = 'center';
  ctx.font = '200 80px ' + FONT; ctx.fillText('The Cup', 960, 240);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  return { x: 960, y: 680 };
}
function caption(txt, tau) {
  const a = smooth((tau - 0.4) / 0.8) * (1 - smooth((tau - 10) / 0.8)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#2c2824'; ctx.font = '300 28px ' + FONT; ctx.fillText(txt, 80, 120); ctx.restore();
}

const RAW = { title: sTitle, cup: sCup, cracks: sCracks, rain: sRain, braid: sBraid, wall: sWall, remains: sRemains, end: sEnd };
const DRAW = {};
for (const k in RAW) DRAW[k] = (tau) => { lay(k, tau); return RAW[k](tau); };
function render(t, c, ox, oy, sc) {
  ctx = c; c.save(); c.setTransform(sc, 0, 0, sc, ox, oy); c.beginPath(); c.rect(0, 0, W, H); c.clip();
  let i = 0; while (i < S.length - 1 && t >= S[i + 1].start) i++;
  const s = S[i]; c.save(); const bp = DRAW[s.id](t - s.start) || { x: W / 2, y: H / 2 }; c.restore();
  const n = S[i + 1];
  if (n && t > n.start - TR) {
    const r = easeInOut((t - (n.start - TR)) / TR) * 2300;
    c.save(); circle(bp.x, bp.y, r); c.clip(); c.save(); DRAW[n.id](t - n.start); c.restore(); c.restore();
    circle(bp.x, bp.y, r); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 5; c.stroke();
  }
  let fade = 0; if (t < .8) fade = 1 - t / .8; if (t > TOTAL - 2) fade = smooth((t - (TOTAL - 2)) / 2);
  if (fade > 0) { c.fillStyle = `rgba(7,8,11,${fade})`; c.fillRect(0, 0, W, H); }
  c.restore();
}
function fit() { const d = Math.min(2, window.devicePixelRatio || 1); canvas.width = Math.round(innerWidth * d); canvas.height = Math.round(innerHeight * d); }
function draw(t) {
  const c = canvas.getContext('2d'), cw = canvas.width, ch = canvas.height, sc = Math.min(cw / W, ch / H);
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#07080b'; c.fillRect(0, 0, cw, ch);
  render(t, c, (cw - W * sc) / 2, (ch - H * sc) / 2, sc);
}

/* ============================ PLAYBACK =========================== */
const ui = document.getElementById('ui'), btn = document.getElementById('play');
let ac = null, eng = null, t0 = 0, idx = 0, timer = 0, ended = false, still = .95;
const filmTime = () => ac ? ac.currentTime - t0 - (ac.outputLatency || 0) : still;
function pump() { const now = ac.currentTime - t0; while (idx < score.length && score[idx].t < now + 1.2) { const e = score[idx++]; eng.play(e, t0 + e.t); } }
function start() {
  if (ac) ac.close();
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  eng = Engine(ac); t0 = ac.currentTime + .3; idx = 0; ended = false;
  clearInterval(timer); timer = setInterval(pump, 50); pump(); ui.classList.add('hide');
}
function frame() {
  const t = filmTime(); draw(clamp(t, 0, TOTAL));
  if (ac && !ended && t > TOTAL + 1.5) { ended = true; clearInterval(timer); btn.textContent = 'Play again'; ui.classList.remove('hide'); }
  requestAnimationFrame(frame);
}

/* ============================ TEST MODES ========================= */
async function audioTest() {
  const sr = 44100, len = Math.ceil(sr * (TOTAL + 3)), oc = new OfflineAudioContext(2, len, sr), e = Engine(oc);
  // schedule the way live playback does: 1 s steps, 1.2 s lookahead
  let k = 0; const feed = now => { while (k < score.length && score[k].t < now + 1.2) { const n = score[k++]; e.play(n, n.t + .05); } };
  for (let tt = 1; tt < TOTAL + 2; tt++) oc.suspend(tt).then(() => { feed(tt); oc.resume(); });
  feed(0); const w0 = performance.now();
  const buf = await oc.startRendering(), renderSec = (performance.now() - w0) / 1000, L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, clip = 0; for (let i = 0; i < len; i++) { const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > peak) peak = a; if (a >= .999) clip++; }
  const rms = (a, b) => { let s = 0; const i0 = Math.floor(a * sr), i1 = Math.min(len, Math.floor(b * sr)); for (let i = i0; i < i1; i++) s += L[i] * L[i] + R[i] * R[i]; return Math.sqrt(s / (2 * (i1 - i0))); };
  const db = x => (20 * Math.log10(x)).toFixed(1);
  const out = { renderSec: +renderSec.toFixed(1), notes: score.length, byInst: score.reduce((o, n) => (o[n.inst] = (o[n.inst] || 0) + 1, o), {}), seconds: +(len / sr).toFixed(2),
    peak: +peak.toFixed(4), peakDb: db(peak), clippedSamples: clip, rmsDbAll: db(rms(0, TOTAL)),
    scenes: S.map(s => ({ id: s.id, from: s.start, to: s.start + s.dur, rmsDb: db(rms(s.start, s.start + s.dur)) })), tailRmsDb: db(rms(TOTAL, TOTAL + 3)) };
  document.body.innerHTML = '<pre id="result">' + JSON.stringify(out, null, 1) + '</pre>'; document.title = 'AUDIOTEST DONE';
}
function sheet() {
  const times = (new URLSearchParams(location.search).get('sheet') || '').split(',').filter(Boolean).map(Number);
  const T = times.length ? times : [3, 9, 13.5, 17.6, 21, 26, 32, 34.2, 40, 43.3, 47.4, 50, 57, 64, 68, 76, 80, 85];
  const cols = 4, cw = 480, chh = 270, rows = Math.ceil(T.length / cols);
  canvas.width = cols * cw; canvas.height = rows * (chh + 24); canvas.style.width = canvas.width + 'px'; canvas.style.height = canvas.height + 'px';
  document.body.style.overflow = 'visible'; ui.classList.add('hide');
  const c = canvas.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, canvas.width, canvas.height);
  T.forEach((t, k) => { const x = (k % cols) * cw, y = Math.floor(k / cols) * (chh + 24);
    render(t, c, x, y, cw / W); c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#fff'; c.font = `16px ${FONT}`; c.fillText('t = ' + t + ' s', x + 8, y + chh + 18); });
}

const Q = new URLSearchParams(location.search);
if (Q.has('audiotest')) { ui.classList.add('hide'); audioTest().catch(err => { document.body.innerHTML = '<pre id="result">ERROR ' + err + '</pre>'; }); }
else if (Q.has('sheet')) sheet();
else if (Q.has('t')) { ui.classList.add('hide'); const t = +Q.get('t'); fit(); draw(t); addEventListener('resize', () => { fit(); draw(t); }); }
else {
  fit(); addEventListener('resize', fit);
  btn.addEventListener('click', start);
  addEventListener('keydown', e => {
    if (e.code === 'Space' && ac) { e.preventDefault(); ac.state === 'running' ? ac.suspend() : ac.resume(); }
    if (e.key === 'r' || e.key === 'R') start();
  });
  requestAnimationFrame(frame);
}
