const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const hash = (x, y) => { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

function buildBackground() {
  const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) bg[y * W + x] = c; };
  const stamp = (g, x0, y0, map) => {
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[y].length; x++) {
      const ch = g[y][x]; if (ch === ".") continue;
      put(x0 + x, y0 + y, map[ch]);
    }
  };
  for (let y = 0; y < 48; y++) {
    const f = y / 48;
    for (let x = 0; x < W; x++) {
      let c = f < 0.4 ? 1 : f < 0.7 ? 2 : 3;
      if (bayer(x, y) < (f % 0.22) * 2.1) c = Math.min(4, c + 1);
      bg[y * W + x] = c;
    }
  }
  const sx = 204, sy = 16, sr = 10;
  for (let y = sy - sr - 5; y <= sy + sr + 5; y++) for (let x = sx - sr - 5; x <= sx + sr + 5; x++) {
    const d = Math.hypot(x + 0.5 - sx, y + 0.5 - sy);
    if (d <= sr) put(x, y, d > sr - 2 && x + y > sx + sy - 4 ? 4 : 18);
    else if (d < sr + 5 && bayer(x, y) < (1 - (d - sr) / 5) * 0.55) put(x, y, 4);
  }
  const tile = (x0, y0, w, h, seed) => {
    const base = hash(seed, 3) < 0.42 ? 19 : 8;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      let c = base;
      if (y === y0 || x === x0) c = 7;
      if (y === y0 + h - 1 || x === x0 + w - 1) c = 20;
      const n = hash(x * 3 + seed, y * 7);
      if (c === base && n < 0.08) c = 11;
      if (c === base && n > 0.965) c = 6;
      put(x, y, c);
    }
    if (hash(seed, 9) < 0.3) {
      let cx = x0 + 2 + Math.floor(hash(seed, 11) * (w - 5)), cy = y0 + 1;
      while (cy < y0 + h - 1) { put(cx, cy, 11); cy++; cx += hash(seed, cy) < 0.5 ? 0 : (hash(cy, seed) < 0.5 ? 1 : -1); }
    }
  };
  const clay = (x0, y0, w, h, seed) => {
    const base = hash(seed, 5) < 0.5 ? 9 : 10;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      let c = base;
      if (y === y0) c = 17;
      if (x === x0) c = 10;
      if (y === y0 + h - 1) c = 23;
      const n = hash(x * 5 + seed, y * 3);
      if (n < 0.06) c = 11;
      if (n > 0.97) c = 18;
      put(x, y, c);
    }

const FPS = 12;
const IDLE_END = 48, CHARGE_END = 72, SLAP_END = 96, LOOP = 112;
const BELLY_KEYS = [0, 0, 0, 1, 1, 1, 2, 2, 2, 2, 1, 1, 0, 0, 1, 0];
const SHAKE = [[3,0],[-3,1],[2,-2],[-2,2],[3,1],[0,-2],[-2,0],[2,1],[0,-1],[-1,1],[2,0],[0,1],[-1,-1],[1,0],[0,0],[2,-1]];

function pose(t) {
  const p = { phase: "idle", belly: 0, blink: 0, arm: 0, salt: 0, shake: [0, 0], clap: 0, hy: 0, spark: false, light: 0 };
  if (t < IDLE_END) {
    p.belly = BELLY_KEYS[t % 16];
    p.hy = p.belly === 2 ? -1 : 0;
    const b = t % 40;
    if (b === 16 || b === 20) p.blink = 1;
    else if (b === 17 || b === 18 || b === 19) p.blink = 2;
  } else if (t < CHARGE_END) {
    const c = t - IDLE_END;
    p.phase = "charge";
    p.arm = c < 8 ? 1 : 2;
    p.salt = c < 6 ? 0 : c < 18 ? (c - 6) / 12 : 1;
    p.belly = c < 5 ? 1 : 2;
    p.hy = -1;
    p.spark = c >= 8 && c % 2 === 0;
    if (c === 10 || c === 11) p.blink = 2;
  } else if (t < SLAP_END) {
    const f = t - CHARGE_END;
    p.phase = "slap";
    p.arm = 3;
    p.clap = f < 4 ? 1 : 0;
    p.belly = f < 4 ? 0 : 1;
    p.hy = f < 3 ? 1 : 0;
    p.blink = f < 4 ? 2 : 0;
    p.light = f < 18 ? 1 - f * 0.04 : 0;
    const amp = f < 5 ? 1 : f < 16 ? 0.6 : 0;
    const s = SHAKE[f % SHAKE.length];
    p.shake = amp === 1 ? s : amp ? [Math.sign(s[0]) * (1 + (f % 2)), Math.sign(s[1]) * (f % 2)] : [0, 0];
  } else {
    const r = t - SLAP_END;
    p.arm = r < 6 ? 1 : 0;
    p.belly = r > 8 ? 1 : 0;
    p.blink = r === 8 ? 2 : r === 9 ? 1 : 0;
  }
  return p;
}

const DW = 72, DH = 64;
const dbuf = new Uint8Array(DW * DH);
const DX = 92, DY = 58;
function dput(x, y, c) { x = x | 0; y = y | 0; if (x >= 0 && y >= 0 && x < DW && y < DH) dbuf[y * DW + x] = c; }
function drawGrid(g, x0, y0) {
  for (let y = 0; y < g.length; y++) for (let x = 0; x < g[y].length; x++) {
    const ch = g[y][x]; if (ch === ".") continue; dput(x0 + x, y0 + y, K[ch]);
  }
}
function disc(cx, cy, r, c) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
      if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r) dput(x, y, c);
}
function drawSumo(p) {
  dbuf.fill(T);
  const y0 = 18 + p.hy;
  const stretch = p.belly;
  for (let y = 0; y < BODY.length; y++) {
    const row = BODY[y];
    const dy = y >= 6 && y <= 12 ? stretch : 0;
    for (let x = 0; x < row.length; x++) if (row[x] !== ".") dput(24 + x, y0 + y + dy, K[row[x]]);
    if (y === 8) for (let s = 1; s <= stretch; s++) for (let x = 0; x < row.length; x++) if (row[x] !== ".") dput(24 + x, y0 + y + s, K[row[x]]);
  }
  drawGrid(BELLY, 28, y0 + 4 + stretch);
  drawGrid(MAWASHI, 28, y0 + 9 + stretch);
  if (p.belly >= 2) disc(34, y0 + 8, 5.4, 14);
  drawGrid(HEAD, 28, y0 - 7);
  drawGrid(TOPKNOT, 31, y0 - 11);
  drawGrid(EAR, 27, y0 - 5);
  drawGrid(EAR, 38, y0 - 5);
  drawGrid(FACE_MARK, 31, y0 - 3);
  drawGrid(FOOT_L, 28, y0 + 17);
  drawGrid(FOOT_R, 40, y0 + 17);
  if (p.belly >= 2) drawGrid(BELLY_PUFF, 26, y0 + 5);
  if (p.arm === 2) drawGrid(SALT_BAG, 50, y0 - 2);
  if (p.arm === 3) drawGrid(SHOCK, 48, y0 + 8);
  if (p.arm === 1) drawGrid(ARM_WIND, 44, y0 + 3);
  drawGrid(TESSEN, 8, y0 + 10);
  if (p.blink === 1) { dput(31, y0 - 4, 13); dput(34, y0 - 4, 13); }
  if (p.blink === 2) { dput(31, y0 - 4, 11); dput(32, y0 - 4, 11); dput(34, y0 - 4, 11); dput(35, y0 - 4, 11); }
  if (p.arm === 0) { drawGrid(ARM_L, 22, y0 + 6); drawGrid(ARM_L, 44, y0 + 6); }
  else if (p.arm === 1 || p.arm === 2) { drawGrid(ARM_THROW, 44, y0 + 1); drawGrid(ARM_L, 22, y0 + 6); }
  else { drawGrid(ARM_SLAP, 44, y0 + 6); drawGrid(ARM_SLAP, 16, y0 + 6); }
  const out = [];
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    if (dbuf[y * DW + x] !== T) continue;
    if ((x > 0 && dbuf[y * DW + x - 1] !== T && dbuf[y * DW + x - 1] !== 0) ||
        (x < DW - 1 && dbuf[y * DW + x + 1] !== T && dbuf[y * DW + x + 1] !== 0) ||
        (y > 0 && dbuf[(y - 1) * DW + x] !== T && dbuf[(y - 1) * DW + x] !== 0) ||
        (y < DH - 1 && dbuf[(y + 1) * DW + x] !== T && dbuf[(y + 1) * DW + x] !== 0)) out.push(y * DW + x);
  }
  for (const i of out) dbuf[i] = 0;
  return { hx: DX + 50, hy: DY + y0 + 6, sx: DX + 48, sy: DY + y0 + 8 };
}

let salt = [];
let R = rng(5);
function stepSalt(p, m) {
  for (const q of salt) {
    q.age++; q.x += q.vx; q.y += q.vy;
    if (q.k === "salt") q.vy += 0.18;
    else { q.vx *= 0.92; q.vy -= 0.04; }
  }
  salt = salt.filter(q => q.age < q.life && q.y < H + 4 && q.x > -6 && q.x < W + 6);
  if (p.phase === "charge" && p.arm === 2 && p.salt > 0.15 && p.salt < 0.98) {
    for (let i = 0; i < 6; i++) salt.push({
      k: "salt", x: m.hx + R() * 5, y: m.hy, vx: 0.6 + R() * 1.8, vy: -2.4 - R() * 1.6,
      age: 0, life: 14 + (R() * 10 | 0)
    });
  }
  if (p.phase === "slap" && p.light > 0.2) {
    for (let i = 0; i < 7; i++) salt.push({
      k: "dust", x: m.sx + R() * 18 - 4, y: RING_Y + 14 + R() * 8,
      vx: (R() - 0.3) * 3, vy: -0.8 - R() * 1.4, age: 0, life: 10 + (R() * 8 | 0)
    });
  }
}
function plot(x, y, c) {
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && y >= 0 && x < W && y < H) fb[y * W + x] = c;
}
function drawBlob(x, y, s, c) {
  x = Math.round(x); y = Math.round(y);
  const shapes = { 1: ["#"], 2: ["##", "##"], 3: [".#.", "###", ".#."], 4: [".##.", "####", "####", ".##."] };
  const g = shapes[s], o = s >> 1;
  for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++)
    if (g[j][i] === "#") plot(x + i - o, y + j - o, c);
}

function render(t) {
  const p = pose(t);
  const [ox, oy] = p.shake;
  fb.set(bg);
  for (const d of dust) if ((t + d.ph) % 14 !== 5) fb[d.y * W + d.x] = 10;
  if (ox || oy) {
    for (let y = 86; y < H; y++) for (let x = 0; x < W; x++) {
      const srcx = Math.min(W - 1, Math.max(0, x + ((y + t) % 2 ? ox : -ox)));
      const src = bg[y * W + srcx];
      if (src === 9 || src === 10 || src === 11 || src === 5) fb[y * W + x] = src;
    }
    for (let x = 24; x < 232; x++) {
      const y = 96 + Math.round(Math.sin(x * 0.21 + t) * Math.max(1, Math.abs(ox)));
      if (y > 80 && y < H) fb[y * W + x] = 11;
    }
  }
  const m = drawSumo(p);
  stepSalt(p, m);
  if (p.light > 0) {
    const lx = m.sx + 8, ly = RING_Y + 12;
    for (let y = RING_Y; y < H; y++) for (let x = 36; x < 220; x++) {
      const c = fb[y * W + x]; if (c !== 9 && c !== 10 && c !== 5 && c !== 23) continue;
      const I = p.light * (1 - Math.hypot(x - lx, (y - ly) * 1.15) / 52);
      if (I <= 0) continue;
      if (I > bayer(x, y) + 0.4) fb[y * W + x] = 18;
      else if (I > bayer(x, y)) fb[y * W + x] = 17;
    }
  }
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    const c = dbuf[y * DW + x]; if (c === T) continue;
    const sx = DX + x, sy = DY + y;
    if (sx >= 0 && sy >= 0 && sx < W && sy < H) fb[sy * W + sx] = c;
  }
  for (const q of salt) {
    if ((q.age + (q.life & 2)) % 3 === 2 && q.k === "salt") continue;
    const r = q.age / q.life;
    if (q.k === "salt") { plot(q.x, q.y, r < 0.3 ? 18 : r < 0.7 ? 17 : 10); if (q.age < 6) plot(q.x + 1, q.y, 17); }
    else drawBlob(q.x, q.y, r < 0.35 ? 3 : 2, r < 0.4 ? 14 : r < 0.7 ? 10 : 8);
  }
  if (p.clap) { plot(m.sx, m.sy, 18); plot(m.sx + 1, m.sy, 18); plot(m.sx, m.sy + 1, 4); drawBlob(m.sx + 4, m.sy + 2, 3, 17); }
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const yy = Math.min(H - 1, Math.max(0, y + oy));
    for (let x = 0; x < W; x++) {
      const xx = Math.min(W - 1, Math.max(0, x + ox));
      const rgb = RGB[fb[yy * W + xx]], o = (y * W + x) * 4;
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return p;
}
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, (innerHeight - 40) / H)));
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
}
addEventListener("resize", fit); fit(); buildBackground(); dressBg();
const labels = [...document.querySelectorAll("#state span")];
let lastPhase = "";
function showPhase(ph) { if (ph === lastPhase) return; lastPhase = ph; for (const l of labels) l.classList.toggle("on", l.dataset.s === ph); }
const freeze = new URLSearchParams(location.search).get("frame");
let tick = 0;
if (freeze !== null) {
  const N = Math.max(0, parseInt(freeze, 10) || 0); let p;
  for (let i = 0; i <= N; i++) p = render(i % LOOP);
  showPhase(p.phase);
} else {
  const start = performance.now();
  (function loop(now) {
    const want = Math.floor((now - start) / (1000 / FPS));
    while (tick <= want) { const p = render(tick % LOOP); showPhase(p.phase); tick++; }
    requestAnimationFrame(loop);
  })(start);
}
</script>
