  const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) bg[y * W + x] = c; };
  const stamp = (g, x0, y0, map) => {
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[y].length; x++) {
      const ch = g[y][x]; if (ch === ".") continue;
      put(x0 + x, y0 + y, map[ch]);
    }
  };
  for (let y = 0; y < H; y++) {
    const f = y / H;
    for (let x = 0; x < W; x++) {
      let c = 0;
      if (f > 0.16 && bayer(x, y) < (f - 0.16) * 0.32) c = 1;
      if (f > 0.38 && bayer(x + 1, y) < (f - 0.38) * 0.42) c = 2;
      if (f > 0.6 && bayer(x, y + 1) < (f - 0.6) * 0.5) c = 3;
      if (f > 0.78 && bayer(x + 2, y) < (f - 0.78) * 0.65) c = 15;
      if (hash(x * 2, y * 5) < 0.01) c = Math.min(3, c + 1);
      bg[y * W + x] = c;
    }

  const rock = (x0, y0, w, h, seed) => {
    const base = hash(seed, 3) < 0.45 ? 4 : 3;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const dx = (x - x0) / w, dy = (y - y0) / h;

      let c = base;
      if (y === y0 || x === x0) c = Math.min(5, base + 1);
      if (y === y0 + h - 1 || x === x0 + w - 1) c = 2;

      if (n > 0.96) c = 5;

const FPS = 12;
const IDLE_END = 56, CHARGE_END = 80, JAW_END = 104, LOOP = 120;
const DRIFT = [0,0,0,1,1,1,2,2,2,1,1,0,0,-1,-1,-1,0,0,1,1];
const SHAKE = [[2,0],[-2,1],[1,-1],[-1,2],[2,1],[0,-1],[-1,0],[1,1],[0,-1],[-1,1],[1,0],[0,0]];

function pose(t) {
  const p = { phase: "idle", drift: 0, jaw: 0, lure: 0.15, blink: 0, open: 0, shake: [0, 0], fin: 0, spark: false, bite: false };
  p.drift = DRIFT[t % DRIFT.length] + Math.sin(t * 0.18) * 5;
  p.fin = (t % 8) < 4 ? 0 : 1;
  if (t < IDLE_END) {
    p.lure = 0.12 + 0.1 * Math.sin(t * 0.35) + (t % 14 < 2 ? 0.18 : 0);
    const b = t % 50;
    if (b === 22 || b === 23) p.blink = 1;
    if (b === 40) p.blink = 1;
  } else if (t < CHARGE_END) {
    const c = t - IDLE_END;
    p.phase = "charge";
    p.lure = Math.min(1, 0.3 + c / 16);
    p.jaw = c > 14 ? 1 : 0;
    p.spark = c >= 6 && c % 2 === 0;
    p.fin = 1;
    if (c > 18) p.blink = 1;
  } else if (t < JAW_END) {
    const f = t - CHARGE_END;
    p.phase = "jaws";
    p.open = f < 4 ? f / 4 : f < 16 ? 1 : Math.max(0, 1 - (f - 16) / 8);
    p.lure = 1 - p.open * 0.25;
    p.jaw = 1;
    p.bite = f < 18;
    const amp = f < 5 ? 1 : f < 14 ? 0.5 : 0;
    const s = SHAKE[f % SHAKE.length];
    p.shake = amp === 1 ? s : amp ? [Math.sign(s[0]) * (f % 2), 0] : [0, 0];
  } else {
    const r = t - JAW_END;
    p.jaw = r < 6 ? 1 : 0;
    p.lure = 0.35;
    p.open = 0;
    p.blink = r === 8 ? 1 : 0;
  }
  return p;
}

const DW = 96, DH = 52;
const dbuf = new Uint8Array(DW * DH);
function dput(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < DW && y < DH) dbuf[y * DW + x] = c; }
function drawGrid(g, x0, y0) {
  for (let y = 0; y < g.length; y++) for (let x = 0; x < g[y].length; x++) {
    const ch = g[y][x]; if (ch === ".") continue;
    dput(x0 + x, y0 + y, MAP[ch]);
  }
}
function disc(cx, cy, r, c) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
      if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r) dput(x, y, c);
}

  const y0 = 16 + Math.round(Math.sin(t * 0.12) * 2);

  drawGrid(p.fin ? FIN_SWEEP : FIN_IDLE, x0 + 6, y0 + 1);
  drawGrid(DORSAL, x0 + 14, y0 - 2);
  drawGrid(BODY, x0, y0);
  drawGrid(GILL, x0 + 8, y0 + 8);
  drawGrid(SPINE, x0 + 18, y0 - 1);
  drawGrid(SPINE, x0 + 22, y0);
  drawGrid(FIN_BACK, x0 + 2, y0 + 8);
  drawGrid(BONES, x0 + 36, y0 + 16);
  drawGrid(EYE_OPEN, x0 + 10, y0 + 5);
  drawGrid(FINS_PAIR, x0 + 10, y0 + 12);
  if (p.open > 0.5) drawGrid(MOUTH_DARK, x0 + 12, jy + 1);
  const rodX = x0 + 26, rodY = y0 + 2;
  for (let i = 0; i < 11; i++) {
    const x = rodX + i;
    const y = rodY - i - Math.round(Math.sin(t * 0.3 + i * 0.4) * (p.phase === "idle" ? 0.6 : 0.15));
    dput(x, y, i < 7 ? 4 : 12);
  }
  const ex = rodX + 10, ey = rodY - 10;
  const glow = p.lure;
  disc(ex, ey, 2.2 + glow * 1.4, glow > 0.7 ? 10 : 9);
  disc(ex, ey, 1.1, 11);
  if (glow > 0.2) {
    const R = 3 + glow * 8;
    for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
      const c = dbuf[y * DW + x]; if (c === T) continue;
      const d = Math.hypot(x - ex, y - ey); if (d > R) continue;
      const I = glow * (1 - d / R) * 1.4, b = bayer(x, y);
      if (I > b + 0.65) dbuf[y * DW + x] = c >= 9 ? 11 : 10;
      else if (I > b + 0.3) dbuf[y * DW + x] = c <= 4 ? 8 : 9;
      else if (I > b && c < 4) dbuf[y * DW + x] = 7;
    }
  }
  const jy = y0 + 12 + Math.round(p.open * 4);
  if (p.open > 0.55) drawGrid(p.open > 0.85 ? JAW_WIDE : JAW_OPEN, x0 + 6, jy);
  else if (p.open > 0.2 || p.jaw) drawGrid(JAW_HALF, x0 + 7, y0 + 12);
  else drawGrid(JAW_SHUT, x0 + 8, y0 + 12);
  if (p.open > 0.4) {
    for (const tx of TEETH_UP) {
      dput(x0 + 8 + Math.round(tx * 0.35), jy, 11);
      dput(x0 + 9 + Math.round(tx * 0.35), jy + 4, 11);
    }
    for (let y = jy + 1; y < jy + 4; y++) for (let x = x0 + 12; x < x0 + 28; x++) {
      const c = dbuf[y * DW + x]; if (c !== 11) dput(x, y, 0);
    }
  }
  const eye = x0 + 10;
  dput(eye, y0 + 6, p.blink ? 4 : 14);
  if (!p.blink) dput(eye + 1, y0 + 6, 11);
  if (p.phase === "charge" && glow > 0.5) drawGrid(PREY, x0 + 48, y0 + 4);
  const out = [];
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    if (dbuf[y * DW + x] !== T) continue;
    if ((x > 0 && dbuf[y * DW + x - 1] !== T && dbuf[y * DW + x - 1] !== 0) ||
        (x < DW - 1 && dbuf[y * DW + x + 1] !== T && dbuf[y * DW + x + 1] !== 0) ||
        (y > 0 && dbuf[(y - 1) * DW + x] !== T && dbuf[(y - 1) * DW + x] !== 0) ||
        (y < DH - 1 && dbuf[(y + 1) * DW + x] !== T && dbuf[(y + 1) * DW + x] !== 0)) out.push(y * DW + x);
  }
  for (const i of out) dbuf[i] = 0;
  return { x0, y0, ex, ey, mx: x0 + 30, my: jy + 2 };
}

let debris = [];
let R = rng(2);
function stepDebris(p, m) {
  for (const q of debris) { q.x += q.vx; q.y += q.vy; q.life--; if (q.k === "glow") q.vy -= 0.03; }
  debris = debris.filter(q => q.life > 0 && q.x < W + 4 && q.x > -4);
  if (p.bite) {
    for (let i = 0; i < 7; i++) debris.push({ k: "bite", x: m.mx, y: m.my + R() * 6, vx: 2.4 + R() * 3.2, vy: (R() - 0.5) * 1.3, life: 10 + (R() * 8 | 0), c: R() < 0.5 ? 11 : 10 });
  }
  if (p.spark) debris.push({ k: "glow", x: m.ex, y: m.ey, vx: 0.2 + R() * 0.5, vy: -0.3 - R() * 0.4, life: 8 + (R() * 6 | 0), c: 10 });
}
function plot(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) fb[y * W + x] = c; }
function drawBlob(x, y, s, c) {
  x = Math.round(x); y = Math.round(y);
  const shapes = { 1: ["#"], 2: ["##", "##"], 3: [".#.", "###", ".#."] };
  const g = shapes[s], o = s >> 1;
  for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++)
    if (g[j][i] === "#") plot(x + i - o, y + j - o, c);
}

function render(t) {
  const p = pose(t);
  fb.set(bg);
  for (const s of motes) {
    const x = ((s.x + t * s.s) % W + W) % W | 0;
    const y = (s.y + Math.sin(t * 0.1 + s.phase) * 2 + H) % H | 0;
    if ((t + s.phase | 0) % 7 !== 0) fb[y * W + x] = s.c;
  }
  for (const w of weeds) {
    const sway = ((t + w.ph) % 10) < 5 ? 1 : 0;
    for (let i = 2; i < w.h; i++) plot(w.x + sway + ((i % 3) - 1), w.y - i, i < 4 ? 7 : 8);
  }
  const DX = 36 + Math.round(p.drift), DY = 52;
  const m = drawAngler(p, t);
  stepDebris(p, { mx: DX + m.mx, my: DY + m.my, ex: DX + m.ex, ey: DY + m.ey });
  if (p.lure > 0.35) {
    const lx = DX + m.ex, ly = DY + m.ey;
    for (let y = ly - 18; y < ly + 22; y++) for (let x = lx - 16; x < lx + 18; x++) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const c = fb[y * W + x]; if (c > 4) continue;
      const I = p.lure * (1 - Math.hypot(x - lx, y - ly) / 22);
      if (I <= 0) continue;
      if (I > bayer(x, y) + 0.5) fb[y * W + x] = c < 2 ? 8 : 9;
      else if (I > bayer(x, y)) fb[y * W + x] = 7;
    }
    for (let k = 0; k < 10; k++) if (bayer(lx, ly + 8 + k) < p.lure * 0.4) plot(lx, ly + 12 + k, 8);
  }
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    const c = dbuf[y * DW + x]; if (c === T) continue;
    const sx = DX + x, sy = DY + y;
    if (sx >= 0 && sy >= 0 && sx < W && sy < H) fb[sy * W + sx] = c;
  }
  for (const q of debris) {
    if (q.k === "bite") drawBlob(q.x, q.y, q.life > 6 ? 3 : 2, q.c);
    else plot(q.x, q.y, q.life > 4 ? 11 : 9);
  }
  const [ox, oy] = p.shake;
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const yy = Math.min(H - 1, Math.max(0, y + oy));
    for (let x = 0; x < W; x++) {
      const xx = Math.min(W - 1, Math.max(0, x + ox));
      const rgb = RGB[fb[yy * W + xx]], o = (y * W + x) * 4;
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return p;
}
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, (innerHeight - 40) / H)));
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
}
addEventListener("resize", fit); fit(); buildBackground(); dressBg();
const labels = [...document.querySelectorAll("#state span")];
let lastPhase = "";
function showPhase(ph) { if (ph === lastPhase) return; lastPhase = ph; for (const l of labels) l.classList.toggle("on", l.dataset.s === ph); }
const freeze = new URLSearchParams(location.search).get("frame");
let tick = 0;
if (freeze !== null) {
  const N = Math.max(0, parseInt(freeze, 10) || 0); let p;
  for (let i = 0; i <= N; i++) p = render(i % LOOP);
  showPhase(p.phase);
} else {
  const start = performance.now();
  (function loop(now) {
    const want = Math.floor((now - start) / (1000 / FPS));
    while (tick <= want) { const p = render(tick % LOOP); showPhase(p.phase); tick++; }
    requestAnimationFrame(loop);
  })(start);
}
</script>
