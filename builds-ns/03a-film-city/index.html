const ORDER = ['title','window','lights','pigeons','steam','subway','tower','end'];
function lay(id, tau) {
  const i = Math.max(0, ORDER.indexOf(id));
  const a = Math.floor(MASS.length * i / 8), b = Math.floor(MASS.length * (i + 1) / 8);
  for (let k = a; k < b; k++) {
    const p = MASS[k];
    if (id === 'window' || id === 'title') {
      ctx.fillStyle = (k % 37 === 4) ? '#f0c14a' : (k % 5 === 0 ? '#1c2838' : '#0e1622');
      ctx.fillRect(p[0], 180 + (p[1] % 520), p[2] * 0.5, (p[2] % 10) + 8);
    } else if (id === 'pigeons') {
      ctx.strokeStyle = 'rgba(210,214,220,.7)'; ctx.lineWidth = 1.4;
      const y = 200 + (p[1] % 400) + Math.sin(tau * 2 + k) * 10;
      ctx.beginPath(); ctx.moveTo(p[0], y); ctx.lineTo(p[0] + 8, y - 4); ctx.lineTo(p[0] + 16, y); ctx.stroke();
    } else if (id === 'steam') {
      ctx.fillStyle = 'rgba(220,226,230,' + (0.05 + (k % 7) * 0.02) + ')';
      circle(p[0], (p[1] + tau * 40) % 700, 6 + (p[2] % 10)); ctx.fill();
    } else if (id === 'subway') {
      ctx.fillStyle = k % 4 === 0 ? '#f4e2a8' : '#243044';
      ctx.fillRect((p[0] + tau * 80) % (W + 40) - 20, 620 + (k % 5) * 28, 22, 14);
    } else {
      ctx.fillStyle = 'rgba(180,190,200,.25)';
      ctx.fillRect(p[0], p[1] % 300, 2, 2);
    }
  }
}
function skyline(night) {
  ctx.fillStyle = night ? '#070b12' : '#1a2430';
  for (let i = 0; i < 48; i++) {
    const x = i * 42 - 10, h = 160 + (hash(i, 3) * 380);
    ctx.fillRect(x, H - h, 36, h);
    if (night) for (let wy = H - h + 16; wy < H - 20; wy += 22) for (let wx = x + 6; wx < x + 30; wx += 10) {
      ctx.fillStyle = hash(wx, wy) > 0.82 ? '#f0c14a' : '#121820';
      ctx.fillRect(wx, wy, 5, 8);
      ctx.fillStyle = '#070b12';
    }
  }
}
function walker(x, y, s, ph) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const sw = Math.sin(ph) * 8;
  ctx.strokeStyle = '#d7dbe2'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(0, -28); ctx.lineTo(sw, 0); ctx.moveTo(0, -28); ctx.lineTo(-sw, 0); ctx.stroke();
  ctx.fillStyle = '#c5cad2'; ctx.fillRect(-8, -58, 16, 32);
  circle(0, -68, 6); ctx.fill();
  ctx.restore();
}
function sTitle(tau) {
  ctx.fillStyle = lin(0, H, ['#070b14', '#121a28', '#1a2432']); ctx.fillRect(0, 0, W, H);
  skyline(true);
  const a = smooth((tau - 0.8) / 1.2);
  ctx.globalAlpha = a; ctx.fillStyle = '#e8e4da'; ctx.textAlign = 'center';
  ctx.font = '200 92px ' + FONT; ctx.fillText('City Sleep', 960, 280);
  ctx.font = '300 28px ' + FONT; ctx.fillText('one window is still awake', 960, 340);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  return { x: 960, y: 640 };
}
function sWindow(tau) {
  ctx.fillStyle = '#0c121c'; ctx.fillRect(0, 0, W, H);
  skyline(true);
  const gx = 760, gy = 280;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 8; c++) {
    const lit = r === 4 && c === 3;
    let glow = 0;
    if (lit) { glow = 0.45; for (const e of score) if (e.glow) { const dt = Math.abs(tau - (e.t - S[1].start)); if (dt < 0.25) glow = 1; } }
    ctx.fillStyle = lit ? 'rgba(240,193,74,' + (0.55 + glow * 0.45) + ')' : (hash(r, c) > 0.9 ? '#243044' : '#101620');
    ctx.fillRect(gx + c * 28, gy + r * 36, 16, 22);
  }
  walker(lerp(200, 900, smooth(tau / 10)), 980, 1.4, tau * 3);
  caption('one yellow window', tau, '#e6e0d2');
  return { x: gx + 90, y: gy + 160 };
}
function sLights(tau) {
  ctx.fillStyle = lin(0, H, ['#10141c', '#1a2030']); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#12161e';
  ctx.beginPath(); ctx.moveTo(700, 220); ctx.lineTo(1220, 220); ctx.lineTo(1700, H); ctx.lineTo(220, H); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 9; i++) {
    const z = i / 8, y = lerp(240, 900, z * z), x = lerp(960, 420, z), sc = lerp(0.4, 1.6, z);
    const phase = Math.floor(tau * 0.8 + i * 0.7) % 3;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.fillStyle = '#2a3038'; ctx.fillRect(-8, -70, 16, 70);
    ['#e23a32', '#e2b23a', '#3aaa56'].forEach((col, k) => { circle(0, -78 - k * 16, 6); ctx.fillStyle = phase === k ? col : '#1a1e24'; ctx.fill(); });
    ctx.restore();
  }
  caption('traffic lights', tau, '#d5dbe4');
  return { x: 960, y: 520 };
}
function sPigeons(tau) {
  ctx.fillStyle = lin(0, 520, ['#121820', '#2a3344']); ctx.fillRect(0, 0, W, 520);
  ctx.fillStyle = '#3a4048'; ctx.fillRect(0, 500, W, H);
  for (let i = 0; i < 36; i++) {
    const ang = tau * 0.4 + i * 0.5, rad = 80 + (i % 6) * 40;
    const x = 960 + Math.cos(ang) * rad * 1.6, y = 360 + Math.sin(ang * 1.3) * rad * 0.45;
    ctx.strokeStyle = '#e4e8ee'; ctx.lineWidth = 2;
    const flap = Math.sin(tau * 8 + i);
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.quadraticCurveTo(x - 4, y - 8 * flap, x, y); ctx.quadraticCurveTo(x + 4, y - 8 * flap, x + 10, y); ctx.stroke();
  }
  caption('pigeons', tau, '#e4e8ee');
  return { x: 960, y: 360 };
}
function sSteam(tau) {
  ctx.fillStyle = '#141820'; ctx.fillRect(0, 0, W, H);
  skyline(true);
  ctx.fillStyle = '#2a3138'; ctx.fillRect(760, 860, 400, 24);
  for (let i = 0; i < 14; i++) ctx.fillRect(780 + i * 26, 860, 8, 24);
  for (let i = 0; i < 40; i++) {
    const u = (tau * 0.15 + i / 40) % 1;
    ctx.fillStyle = 'rgba(230,236,240,' + (0.18 * (1 - u)) + ')';
    circle(960 + Math.sin(i + u * 6) * 50, 860 - u * 520, 10 + u * 28); ctx.fill();
  }
  caption('steam', tau, '#e6ecee');
  return { x: 960, y: 700 };
}
function sSubway(tau) {
  ctx.fillStyle = '#07080c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#12141a'; ctx.fillRect(0, 780, W, 300);
  const x0 = lerp(W + 200, -900, (tau % 6) / 6);
  for (let c = 0; c < 4; c++) {
    const x = x0 + c * 280;
    ctx.fillStyle = '#1c222c'; ctx.fillRect(x, 560, 250, 200);
    for (let w = 0; w < 5; w++) {
      let hot = 0.4;
      for (const e of score) if (e.car) { const dt = Math.abs((tau % 6) - ((e.t * 0.3) % 6)); if (dt < 0.15 && w === (e.m % 5)) hot = 1; }
      ctx.fillStyle = 'rgba(244,226,168,' + hot + ')';
      ctx.fillRect(x + 18 + w * 46, 600, 28, 36);
    }
  }
  caption('subway', tau, '#f0e6c8');
  return { x: 960, y: 640 };
}
function sTower(tau) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, lerpColor(tau)); g.addColorStop(0.5, '#c9846a'); g.addColorStop(1, '#6a3a48');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  skyline(false);
  ctx.fillStyle = '#2a2428';
  ctx.fillRect(860, 420, 18, 260); ctx.fillRect(1040, 420, 18, 260);
  ctx.beginPath(); ctx.moveTo(820, 430); ctx.lineTo(960, 300); ctx.lineTo(1100, 430); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a3438'; ctx.fillRect(800, 300, 320, 140);
  ctx.strokeStyle = '#1a1618'; ctx.lineWidth = 4; ctx.strokeRect(820, 320, 280, 100);
  const a = smooth(tau / 4);
  ctx.fillStyle = 'rgba(240,193,74,' + (0.2 + 0.6 * (1 - a)) + ')';
  ctx.fillRect(900, 520, 10, 14);
  caption('dawn, the water tower', tau, '#2a1820');
  return { x: 960, y: 380 };
}
function lerpColor() { return '#f2b48a'; }
function sEnd(tau) {
  sTower(Math.min(tau, 4));
  ctx.globalAlpha = smooth((tau - 1) / 1.2); ctx.fillStyle = '#2a1820'; ctx.textAlign = 'center';
  ctx.font = '200 72px ' + FONT; ctx.fillText('City Sleep', 960, 180);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  return { x: 960, y: 400 };
}
function caption(txt, tau, col) {
  const a = smooth((tau - 0.6) / 0.8) * (1 - smooth((tau - 10) / 0.8)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = '300 28px ' + FONT;
  ctx.fillText(txt, 80, 1000); ctx.restore();
}

const RAW = { title: sTitle, window: sWindow, lights: sLights, pigeons: sPigeons, steam: sSteam, subway: sSubway, tower: sTower, end: sEnd };
const DRAW = {};
for (const k in RAW) DRAW[k] = (tau) => { lay(k, tau); return RAW[k](tau); };
function render(t, c, ox, oy, sc) {
  ctx = c; c.save(); c.setTransform(sc, 0, 0, sc, ox, oy); c.beginPath(); c.rect(0, 0, W, H); c.clip();
  let i = 0; while (i < S.length - 1 && t >= S[i + 1].start) i++;
  const s = S[i]; c.save(); const bp = DRAW[s.id](t - s.start) || { x: W / 2, y: H / 2 }; c.restore();
  const n = S[i + 1];
  if (n && t > n.start - TR) {
    const r = easeInOut((t - (n.start - TR)) / TR) * 2300;
    c.save(); circle(bp.x, bp.y, r); c.clip(); c.save(); DRAW[n.id](t - n.start); c.restore(); c.restore();
    circle(bp.x, bp.y, r); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 5; c.stroke();
  }
  let fade = 0; if (t < .8) fade = 1 - t / .8; if (t > TOTAL - 2) fade = smooth((t - (TOTAL - 2)) / 2);
  if (fade > 0) { c.fillStyle = `rgba(7,8,11,${fade})`; c.fillRect(0, 0, W, H); }
  c.restore();
}
function fit() { const d = Math.min(2, window.devicePixelRatio || 1); canvas.width = Math.round(innerWidth * d); canvas.height = Math.round(innerHeight * d); }
function draw(t) {
  const c = canvas.getContext('2d'), cw = canvas.width, ch = canvas.height, sc = Math.min(cw / W, ch / H);
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#07080b'; c.fillRect(0, 0, cw, ch);
  render(t, c, (cw - W * sc) / 2, (ch - H * sc) / 2, sc);
}

/* ============================ PLAYBACK =========================== */
const ui = document.getElementById('ui'), btn = document.getElementById('play');
let ac = null, eng = null, t0 = 0, idx = 0, timer = 0, ended = false, still = .95;
const filmTime = () => ac ? ac.currentTime - t0 - (ac.outputLatency || 0) : still;
function pump() { const now = ac.currentTime - t0; while (idx < score.length && score[idx].t < now + 1.2) { const e = score[idx++]; eng.play(e, t0 + e.t); } }
function start() {
  if (ac) ac.close();
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  eng = Engine(ac); t0 = ac.currentTime + .3; idx = 0; ended = false;
  clearInterval(timer); timer = setInterval(pump, 50); pump(); ui.classList.add('hide');
}
function frame() {
  const t = filmTime(); draw(clamp(t, 0, TOTAL));
  if (ac && !ended && t > TOTAL + 1.5) { ended = true; clearInterval(timer); btn.textContent = 'Play again'; ui.classList.remove('hide'); }
  requestAnimationFrame(frame);
}

/* ============================ TEST MODES ========================= */
async function audioTest() {
  const sr = 44100, len = Math.ceil(sr * (TOTAL + 3)), oc = new OfflineAudioContext(2, len, sr), e = Engine(oc);
  // schedule the way live playback does: 1 s steps, 1.2 s lookahead
  let k = 0; const feed = now => { while (k < score.length && score[k].t < now + 1.2) { const n = score[k++]; e.play(n, n.t + .05); } };
  for (let tt = 1; tt < TOTAL + 2; tt++) oc.suspend(tt).then(() => { feed(tt); oc.resume(); });
  feed(0); const w0 = performance.now();
  const buf = await oc.startRendering(), renderSec = (performance.now() - w0) / 1000, L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, clip = 0; for (let i = 0; i < len; i++) { const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > peak) peak = a; if (a >= .999) clip++; }
  const rms = (a, b) => { let s = 0; const i0 = Math.floor(a * sr), i1 = Math.min(len, Math.floor(b * sr)); for (let i = i0; i < i1; i++) s += L[i] * L[i] + R[i] * R[i]; return Math.sqrt(s / (2 * (i1 - i0))); };
  const db = x => (20 * Math.log10(x)).toFixed(1);
  const out = { renderSec: +renderSec.toFixed(1), notes: score.length, byInst: score.reduce((o, n) => (o[n.inst] = (o[n.inst] || 0) + 1, o), {}), seconds: +(len / sr).toFixed(2),
    peak: +peak.toFixed(4), peakDb: db(peak), clippedSamples: clip, rmsDbAll: db(rms(0, TOTAL)),
    scenes: S.map(s => ({ id: s.id, from: s.start, to: s.start + s.dur, rmsDb: db(rms(s.start, s.start + s.dur)) })), tailRmsDb: db(rms(TOTAL, TOTAL + 3)) };
  document.body.innerHTML = '<pre id="result">' + JSON.stringify(out, null, 1) + '</pre>'; document.title = 'AUDIOTEST DONE';
}
function sheet() {
  const times = (new URLSearchParams(location.search).get('sheet') || '').split(',').filter(Boolean).map(Number);
  const T = times.length ? times : [3, 9, 13.5, 17.6, 21, 26, 32, 34.2, 40, 43.3, 47.4, 50, 57, 64, 68, 76, 80, 85];
  const cols = 4, cw = 480, chh = 270, rows = Math.ceil(T.length / cols);
  canvas.width = cols * cw; canvas.height = rows * (chh + 24); canvas.style.width = canvas.width + 'px'; canvas.style.height = canvas.height + 'px';
  document.body.style.overflow = 'visible'; ui.classList.add('hide');
  const c = canvas.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, canvas.width, canvas.height);
  T.forEach((t, k) => { const x = (k % cols) * cw, y = Math.floor(k / cols) * (chh + 24);
    render(t, c, x, y, cw / W); c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#fff'; c.font = `16px ${FONT}`; c.fillText('t = ' + t + ' s', x + 8, y + chh + 18); });
}

const Q = new URLSearchParams(location.search);
if (Q.has('audiotest')) { ui.classList.add('hide'); audioTest().catch(err => { document.body.innerHTML = '<pre id="result">ERROR ' + err + '</pre>'; }); }
else if (Q.has('sheet')) sheet();
else if (Q.has('t')) { ui.classList.add('hide'); const t = +Q.get('t'); fit(); draw(t); addEventListener('resize', () => { fit(); draw(t); }); }
else {
  fit(); addEventListener('resize', fit);
  btn.addEventListener('click', start);
  addEventListener('keydown', e => {
    if (e.code === 'Space' && ac) { e.preventDefault(); ac.state === 'running' ? ac.suspend() : ac.resume(); }
    if (e.key === 'r' || e.key === 'R') start();
  });
  requestAnimationFrame(frame);
}
