body{display:grid;place-items:center;font-family:"IBM Plex Mono",ui-monospace,monospace}
canvas{display:block}

#gate .play::before{content:"";margin-left:6px;border-left:18px solid var(--mark);border-top:11px solid transparent;border-bottom:11px solid transparent}
#gate:hover .play,#gate:focus-visible .play{transform:scale(1.08);background:rgba(224,154,58,.14)}
#gate:focus-visible{outline:none}
#gate .k{color:var(--dim)}
#gate .t{font-size:13px}
</style>
</head>
