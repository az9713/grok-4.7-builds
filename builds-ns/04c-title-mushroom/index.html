<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>THE LAST COURT OF THE MUSHROOM KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@400;600&display=block" rel="stylesheet">
<style>
:root{--bg:#0b0e07;--ink:#efe4b8;--mark:#d4ae3a;--dim:#7a7348}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{display:grid;place-items:center;font-family:"Cinzel",serif}
canvas{display:block}
#gate{position:fixed;inset:0;display:grid;place-content:center;gap:22px;justify-items:center;
  background:rgba(11,14,7,.76);border:0;color:var(--ink);cursor:pointer;font:inherit;
  letter-spacing:.32em;text-transform:uppercase;font-size:12px;padding:16px;text-align:center}
#gate[hidden]{display:none}
#gate .play{display:grid;place-items:center;width:84px;height:84px;border:1px solid var(--mark);border-radius:50%;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),background .4s}
#gate .play::before{content:"";margin-left:6px;border-left:18px solid var(--mark);border-top:11px solid transparent;border-bottom:11px solid transparent}
#gate:hover .play,#gate:focus-visible .play{transform:scale(1.08);background:rgba(212,174,58,.14)}
#gate:focus-visible{outline:none}
#gate .k{color:var(--dim)}
#gate .t{font-size:13px}
</style>
</head>
<body>

<button id="gate" type="button" hidden>
