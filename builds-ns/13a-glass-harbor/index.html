<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>HARBOR GLASS</title>
<style>

</style></head><body>
<canvas id="c"></canvas><div id="vig"></div><div id="fade"></div>
<div id="title">HARBOR GLASS<small>NOON TO NIGHT</small></div>
<div id="season"></div><div id="bar"></div>
<div id="hint">click: pause &middot; &larr; &rarr;: seek 5 s &middot; R: restart</div>
<script>
'use strict';
// ---------------------------------------------------------------- setup
const Q=new URLSearchParams(location.search);
const DUR=80;
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:Q.has('freeze')});
if(!gl){document.body.innerHTML='<p style="padding:2em;font-family:sans-serif">WebGL2 is not available in this browser.</p>';throw new Error('no webgl2');}

// ---------------------------------------------------------------- math
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const mix=(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t);
const hex=h=>[1,3,5].map(k=>parseInt(h.substr(k,2),16)/255);
const lin=c=>c.map(x=>Math.pow(x,2.2));
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
const h2=(x,y)=>hash(x*57.13+y*113.71);
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return (h2(xi,yi)*(1-u)+h2(xi+1,yi)*u)*(1-v)+(h2(xi,yi+1)*(1-u)+h2(xi+1,yi+1)*u)*v;}
const fbm=(x,y)=>vnoise(x,y)*.5+vnoise(x*2.1+5.2,y*2.1+1.3)*.3+vnoise(x*4.3+9.1,y*4.3+7.7)*.2;
let seed=20260927;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

const qId=[0,0,0,1];
const qAxis=(x,y,z,a)=>{const s=Math.sin(a/2),l=Math.hypot(x,y,z)||1;return [x/l*s,y/l*s,z/l*s,Math.cos(a/2)];};
const qMul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
  a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
function qRot(q,v){const [x,y,z,w]=q;const cx=y*v[2]-z*v[1]+w*v[0],cy=z*v[0]-x*v[2]+w*v[1],cz=x*v[1]-y*v[0]+w*v[2];
  return [v[0]+2*(y*cz-z*cy),v[1]+2*(z*cx-x*cz),v[2]+2*(x*cy-y*cx)];}
function qNlerp(a,b,t){const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3],sg=d<0?-1:1;
  const r=a.map((x,i)=>x+(b[i]*sg-x)*t),l=Math.hypot(r[0],r[1],r[2],r[3]);return r.map(x=>x/l);}

const M4={
  persp(f,a,n,fa){const t=1/Math.tan(f/2);return [t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0];},
  ortho(l,r,b,t,n,f){return [2/(r-l),0,0,0,0,2/(t-b),0,0,0,0,-2/(f-n),0,-(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1];},
  look(e,c,u){const nz=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);},cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
    dt=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
    const z=nz([e[0]-c[0],e[1]-c[1],e[2]-c[2]]),x=nz(cr(u,z)),y=cr(z,x);
    return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dt(x,e),-dt(y,e),-dt(z,e),1];},
  mul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
};

// ---------------------------------------------------------------- tile geometry
// One beveled box. Per vertex: corner sign c (vec3), bevel inset i (vec3), flat normal n.
// Local position = c * scale/2 + i * bevel, so the bevel keeps its size on any scale.
function buildTile(){
  const V=[],r=Math.SQRT1_2;
  const quad=(q,n)=>{for(const k of [0,1,2,0,2,3])V.push(...q[k][0],...q[k][1],...n);};
  const sides=[[0,1],[0,-1],[1,1],[1,-1]];
  for(const zs of [1,-1]){
    quad([[1,1],[-1,1],[-1,-1],[1,-1]].map(([x,y])=>[[x,y,zs],[-x,-y,0]]),[0,0,zs]);
    for(const [ax,sg] of sides){
      const inner=[1,-1].map(t=>{const c=[0,0,zs],i=[0,0,0];c[ax]=sg;c[1-ax]=t;i[ax]=-sg;i[1-ax]=-t;return [c,i];});
      const ring=inner.map(([c])=>[c,[0,0,-zs]]);
      const n=[0,0,zs*r];n[ax]=sg*r;
      quad([inner[0],inner[1],ring[1],ring[0]],n);
    }
  }
  for(const [ax,sg] of sides){
    const q=[[1,1],[-1,1],[-1,-1],[1,-1]].map(([t,zs])=>{const c=[0,0,zs];c[ax]=sg;c[1-ax]=t;return [c,[0,0,-zs]];});
    const n=[0,0,0];n[ax]=sg;quad(q,n);
  }
  return new Float32Array(V);
}

// ---------------------------------------------------------------- shaders
const VS=`#version 300 es
layout(location=0) in vec3 aC; layout(location=1) in vec3 aI; layout(location=2) in vec3 aN;
layout(location=3) in vec4 iPos; layout(location=4) in vec4 iRot;
layout(location=5) in vec4 iScl; layout(location=6) in vec4 iCol;
uniform mat4 uVP; uniform mat4 uLVP;
out vec3 vN; out vec3 vW; out vec3 vCol; out vec4 vL; out vec3 vLoc; out float vSeed; out float vShine; out float vGlass; out float vCap;
vec3 qrot(vec4 q,vec3 v){return v+2.0*cross(q.xyz,cross(q.xyz,v)+q.w*v);}
void main(){
  float b=min(0.085,0.26*min(iScl.x,min(iScl.y,iScl.z)));
  vec3 lp=aC*iScl.xyz*0.5+aI*b;
  vec3 w=iPos.xyz+qrot(iRot,lp);
  vN=qrot(iRot,aN); vW=w; vCol=iCol.rgb; vL=uLVP*vec4(w,1.0);
  vLoc=aC+aI*b/max(iScl.xyz*0.5,vec3(1e-4)); vSeed=iPos.w; vShine=iScl.w; vGlass=iCol.a; vCap=aN.z;
  gl_Position=uVP*vec4(w,1.0);
}`;
const FS=`#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vN; in vec3 vW; in vec3 vCol; in vec4 vL; in vec3 vLoc; in float vSeed; in float vShine; in float vGlass; in float vCap;
uniform sampler2DShadow uSh; uniform vec3 uL; uniform vec3 uLC; uniform vec3 uEye; uniform vec3 uSkyA; uniform vec3 uSkyB; uniform float uAmb;
out vec4 o;
float shadowAt(){
  vec3 p=vL.xyz/vL.w*0.5+0.5;
  if(p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0||p.z>1.0) return 1.0;
  vec2 t=1.0/vec2(textureSize(uSh,0)); float s=0.0;
  for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) s+=texture(uSh,vec3(p.xy+vec2(x,y)*t*1.25,p.z-0.0006));
  return s/9.0;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}
void main(){
  vec3 n=normalize(vN);
  if(abs(vCap)>0.9&&vGlass>0.5){ // hammered glass surface on each cap, unique per tile
    vec2 q=vLoc.xy*2.6+vSeed*31.0;
    n=normalize(n+0.14*vec3(sin(q.x*2.3+cos(q.y*1.9+vSeed*6.0)),cos(q.y*2.1+sin(q.x*1.7)),0.0));
  }
  vec3 V=normalize(uEye-vW), L=normalize(uL);
  float sh=shadowAt();
  float ndl=max(dot(n,L),0.0);
  vec3 H=normalize(L+V);
  float pw=mix(24.0,260.0,vShine);
  float spec=pow(max(dot(n,H),0.0),pw)*(0.35+1.6*vShine)*vGlass;
  float fr=pow(1.0-max(dot(n,V),0.0),4.0);
  vec3 R=reflect(-V,n);
  vec3 env=mix(uSkyB,uSkyA,clamp(R.z,0.0,1.0));
  float edge=max(abs(vLoc.x),abs(vLoc.y));
  vec3 body=vCol*(0.78+0.34*(1.0-edge*edge));
  vec3 c=body*(uAmb*(0.55+0.45*n.z)+ndl*sh*uLC);
  c+=vCol*vCol*0.35*(0.35+0.65*sh)*vGlass;          // light passing through the glass
  c+=env*(0.04+0.55*fr)*(0.3+0.7*vShine)*vGlass;    // sky reflection
  c+=uLC*spec*sh;
  o=vec4(pow(aces(c*1.15),vec3(1.0/2.2)),1.0);
}`;
const FS_DEPTH=`#version 300 es
precision mediump float; void main(){}`;

function mkShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function mkProg(vs,fs){const p=gl.createProgram();gl.attachShader(p,mkShader(gl.VERTEX_SHADER,vs));gl.attachShader(p,mkShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

// ---------------------------------------------------------------- quay from noon to night

const S=[
 {name:'NOON',en:'gulls over the quay',skyT:'#3a78c8',skyH:'#c5e4f6',sun:'#fff4c8',sunP:[.72,.82],sunR:.05,cloud:.55,cloudC:'#f7fbff',el:.92,az:2.1,lc:'#fff6e4',amb:.48},
 {name:'FERRY',en:'the afternoon boat',skyT:'#4a6ea8',skyH:'#f0c48a',sun:'#ffb45a',sunP:[.42,.7],sunR:.055,cloud:.4,cloudC:'#f6d8b4',el:.62,az:2.5,lc:'#ffd2a4',amb:.4},
 {name:'DUSK',en:'lanterns take the light',skyT:'#1c2448',skyH:'#c46a58',sun:'#ff7a4a',sunP:[.18,.58],sunR:.04,cloud:.3,cloudC:'#e8b0a0',el:.28,az:2.9,lc:'#ffb088',amb:.28},
 {name:'NIGHT',en:'lanterns on the water',skyT:'#070b18',skyH:'#1a2744',sun:'#f4f0d8',sunP:[.8,.9],sunR:.02,cloud:.15,cloudC:'#243048',el:.15,az:1.2,lc:'#ffd9a0',amb:.22}
];
function scene(k,u,v,r){
  const s=S[k];
  let c=mix(hex(s.skyH),hex(s.skyT),sstep(.48,1,v));
  const d=Math.hypot(u-s.sunP[0],v-s.sunP[1]);
  if(d<s.sunR)c=hex(s.sun);else if(d<s.sunR*2.4)c=mix(c,hex(s.sun),.45*(1-(d-s.sunR)/(s.sunR*1.4)));
  if(v>.62&&fbm(u*4+k,v*9)>s.cloud)c=mix(c,hex(s.cloudC),.8);
  const hz=.46;
  if(v<hz){
    const wave=.5+.5*Math.sin(u*26+v*9+k);
    const deep=k===3?'#071422':k===2?'#1a3048':'#1d6ea8';
    const lite=k===3?'#14283c':k===2?'#3a5870':'#7ec4e4';
    c=mix(hex(deep),hex(lite),clamp(v/hz*.75+wave*.2,0,1));
    if(Math.abs(v-.24)<.025&&u>.12&&u<.9)c=mix(c,[1,1,1],k===3?.15:.4);
    if(v<.1)c=hex(k===3?'#2a241c':'#b7a48a');
    if(v>=.1&&v<.14)c=hex('#6e624e');
    if(k>=2&&v>.1&&v<.16&&hash(Math.floor(u*28)+k*9)>.78)c=hex('#ffb45a');
    if(k===3&&v>.16&&v<.4&&hash(Math.floor(u*22)+3)>.9)c=mix(c,hex('#ffb45a'),.35);
    const wake=Math.abs(u-(.38+.08*k))<( .03+(hz-v)*.06);
    if(wake&&v>.14&&v<.36)c=mix(c,[.85,.9,.95],k===3?.2:.45);
  }
  if(v>hz&&v<hz+.04)c=mix(c,hex('#d8e2ea'),.35);
  const hl=.58+.05*Math.sin(u*6.4)+.02*vnoise(u*14,2.2);
  if(v>hz&&v<hl){
    c=hex(k===3?'#1a221c':k===2?'#3a4a38':'#5a7a58');
    if(u>.78&&v<hl+.1&&v>hl-.02){c=hex(k>=2?'#c4b090':'#d8c8a8');if(v>hl+.06)c=hex('#ffb45a');}
  }
  if(v>=.18&&v<.36&&u>.05&&u<.42){
    const fl=Math.floor((v-.18)/.05);
    c=hex(k===3?'#3a3228':'#c8b89a');
    if(fl===2)c=hex('#7a3a30');
    if((Math.floor(u/.05)+fl)%3===0)c=k>=2?hex('#ffc45a'):hex('#8ec8e8');
  }
  if(k===3&&v>.62&&r[0]>.94)c=mix(c,[1,1,.92],.8);
  return c.map((x,i)=>clamp(x*(.9+.2*r[0])+(r[i]-.5)*.03,0,1));
}
function border(i,j){
  const a=Math.min(i,N-1-i),b=Math.min(j,N-1-j),r=Math.min(a,b);
  if(r>=BW)return null;
  if(r===0)return '#c4a056';
  if(r===1||r===5)return '#0c1424';
  if(a<BW&&b<BW){const d=Math.abs(a-3.5)+Math.abs(b-3.5);return d<1.5?'#d4b46a':d<2.5?'#8a2824':'#142038';}
  const m=((a<b?j:i)-BW)%8,q=r-2;
  return (q==0&&m<6)||(q==1&&(m==1||m==4))||(q==2&&m==3)?'#8a2824':'#142038';
}
const FIG={
 gull:["..WW....WW..",".WWWW..WWWW.","WWWkWWWWkWWW",".WWkkkkkkWW.","..kkkkkkkk..","...k.kk.k..."],
 ferry:["......ssss......","....ssbbbbss....","..ssbbbbbbbbss..","hhhhhhhhhhhhhhhh","wwwwwwwwwwwwwwww",".wwwwwwwwwwww.",],
 lamp:["..gg..",".gggg.","ggLLgg",".gggg.","..ss..","..ss..","..ss.."]
};
function figColor(type,ch){
  const m={gull:{W:'#f4f7fb',k:'#1c2430'},ferry:{s:'#e8eef2',b:'#1a3a5c',h:'#c9843a',w:'#6a4a32'},lamp:{g:'#3a2a18',L:'#ffb03a',s:'#6a5a48'}}[type];
  return m[ch]||'#888888';
}
const FORMS=[
 {t0:-99,t1:1,pile:1},
 {t0:3,t1:16,f:[['gull',-16,8,1],['gull',-2,14,1],['gull',12,6,1],['gull',20,12,-1]]},
 {t0:18,t1:30,f:[['gull',-20,4,-1],['gull',-6,16,1],['gull',10,10,1],['ferry',-8,-6,1]]},
 {t0:32,t1:48,f:[['ferry',-18,-4,1],['gull',14,12,1],['gull',6,18,-1]]},
 {t0:50,t1:58,f:[['lamp',-16,-8],['lamp',-6,-10],['lamp',6,-8],['lamp',16,-6],['ferry',0,-2,1]]},
 {t0:59.2,t1:67.4,f:[['lamp',-20,-6],['lamp',-8,-12],['lamp',4,-8],['lamp',14,-4],['gull',18,10,-1]]},
 {t0:68.4,t1:76.2,f:[['lamp',-18,-4],['lamp',-8,-8],['lamp',2,-4],['lamp',12,-8],['lamp',18,-2],['ferry',8,-6,-1]]},
 {t0:78,t1:999,pile:1}
];

const N=72,BW=6,TS=.86;
function buildSlots(F){
  const out=[];
  F.f.forEach((fg,fi)=>{const [type,x,y,dir=1,vr=0]=fg,g=FIG[type],h=g.length,w=g[0].length;
    for(let r=0;r<h;r++)for(let c=0;c<w;c++){const ch=g[r][c];if(ch=='.')continue;
      let col=figColor(type,ch,vr);if(typeof col=='string')col=hex(col);
      const wing=ch==='W'||ch==='F';
      out.push({type,x,y,dir,ph:fi*1.7+x*.1,lx:(c-(w-1)/2)*dir,ly:(h-1)/2-r,r,c,ch,col:lin(col),
        shine:wing?1:.45+rnd()*.55,sz:wing?.22:.42});}});
  return out;
}
FORMS.forEach(F=>{if(!F.pile)F.slots=buildSlots(F);});
const POOL=Math.max(...FORMS.filter(F=>F.slots).map(F=>F.slots.length));
const pileSlots=src=>src.map(sl=>({pile:1,px:(rnd()-.5)*54,py:-28+rnd()*18,ang:rnd()*6.283,col:sl.col,shine:sl.shine,sz:.42}));
FORMS[0].slots=pileSlots(FORMS[1].slots);
FORMS[FORMS.length-1].slots=pileSlots(FORMS[FORMS.length-2].slots);
function slotState(F,i,t){
  const s=F.slots[i];if(!s)return null;
  if(s.pile)return {p:[s.px,s.py,.40+s.sz/2],q:qAxis(0,0,1,s.ang),col:s.col,sz:s.sz,shine:s.shine};
  const tt=t-F.t0,ph=s.ph,dir=s.dir||1,o=[s.lx,s.ly,0];let c,q=qId,ex=qId;
  if(s.type==='gull'||s.type==='fish'){
    c=[s.x+dir*.42*tt+.8*Math.sin(.9*t+ph),s.y+.35*Math.sin(1.7*t+ph),1.55+.28*Math.sin(2.2*t+ph)];
    q=qAxis(0,0,1,.15*Math.sin(1.1*t+ph));
    if(s.ch==='W'||s.ch==='F'){const f=Math.sin(24*t+ph);o[2]+=.28*f;ex=qAxis(1,0,0,.55*f);}
  }else if(s.type==='ferry'||s.type==='turtle'){
    c=[s.x+dir*.28*tt,s.y+.08*Math.sin(1.3*t+ph),s.type==='turtle'?1.35:1.12];
    q=qMul(qAxis(0,0,1,.04*Math.sin(.6*t)),qAxis(1,0,0,.05*Math.sin(1.4*t+ph)));
    if(s.type==='turtle'&&s.ch==='P'){const f=Math.sin(6*t+ph);o[2]+=.12*f;ex=qAxis(0,1,0,.4*f);}
  }else if(s.type==='lamp'){
    c=[s.x+.04*Math.sin(.8*t+ph),s.y,1.35+.05*Math.sin(1.2*t+ph)];
    q=qAxis(0,1,0,.12*Math.sin(.7*t+ph));
  }else if(s.type==='cup'){
    c=[s.x+.02*Math.sin(.4*t+ph),s.y,1.02];
    q=qAxis(0,0,1,.03*Math.sin(t*.2+ph));
  }else if(s.type==='letter'){
    const tear=sstep(F.t0+2,F.t0+6,t);
    c=[s.x+(s.lx>0?tear*1.2:-tear*.2),s.y,1.08+tear*.15];
    q=qAxis(0,0,1,(s.lx>0?.5:-.2)*tear);
  }else if(s.type==='hand'){
    c=[s.x+dir*.15*Math.sin(.7*t+ph),s.y+.1*Math.sin(.5*t),1.2];
    q=qAxis(1,0,0,.2*Math.sin(.6*t+ph));
  }else if(s.type==='coral'){
    c=[s.x,s.y,1.05+.04*Math.sin(.5*t+ph)];
    q=qAxis(0,0,1,.08*Math.sin(.3*t+ph));
  }else{c=[s.x,s.y,1.2];}
  const w=qRot(q,o);
  return {p:[c[0]+w[0],c[1]+w[1],c[2]+w[2]],q:qMul(q,ex),col:s.col,sz:s.sz,shine:s.shine};
}

function poolState(i,t){
  let k=0;while(k<FORMS.length-1&&t>=FORMS[k].t1)k++;
  const B=FORMS[k];if(k==0||t>=B.t0)return slotState(B,i,t);
  const A=FORMS[k-1],D=B.t0-A.t1,R=n=>hash(i*31.7+k*7.13+n*1.37);
  const st=A.t1+R(1)*.35*D,en=B.t0-R(2)*.15*D;
  if(t<st)return slotState(A,i,t);
  if(t>=en)return slotState(B,i,t);
  let a=slotState(A,i,st),b=slotState(B,i,en);if(!a&&!b)return null;
  const s=(t-st)/(en-st),e=s*s*(3-2*s),lat=[(R(4)-.5)*14,(R(5)-.5)*14,5+R(3)*9];
  let g=1;
  if(!a){a={...b,p:[b.p[0]+lat[0]*1.5,b.p[1]+lat[1]*1.5,b.p[2]+14]};g=sstep(0,.35,s);}
  if(!b){b={...a,p:[a.p[0]+lat[0]*1.5,a.p[1]+lat[1]*1.5,a.p[2]+14]};g=1-sstep(.65,1,s);}
  const P1=[a.p[0]+lat[0]*.5,a.p[1]+lat[1]*.5,a.p[2]+lat[2]],P2=[b.p[0]-lat[1]*.4,b.p[1]+lat[0]*.4,b.p[2]+lat[2]];
  const u=1-e,p=[0,1,2].map(j=>u*u*u*a.p[j]+3*u*u*e*P1[j]+3*u*e*e*P2[j]+e*e*e*b.p[j]);
  const tq=qAxis(R(7)-.5,R(8)-.5,R(9)-.5,(1+Math.floor(R(6)*2))*6.2832*e);
  return {p,q:qMul(tq,qNlerp(a.q,b.q,e)),col:mix(a.col,b.col,e),sz:a.sz+(b.sz-a.sz)*e,shine:a.shine,g};
}

// ---------------------------------------------------------------- background tiles
const T=[18.4,38.4,58.4], FLIP=[[1,0,0],[0,1,0],[1,1,0]];
const BG=[];
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const rr=[rnd(),rnd(),rnd()],bc=border(i,j),sz=.30+rnd()*.08;
  const b={x:i-(N-1)/2,y:j-(N-1)/2,z:sz/2,sx:.84+rnd()*.08,sy:.84+rnd()*.08,sz,seed:rnd(),shine:.3+rnd()*.7,
    q:qMul(qAxis(0,0,1,(rnd()-.5)*.14),qAxis(rnd()-.5,rnd()-.5,0,rnd()*.06))};
  if(bc){b.cols=[lin(hex(bc).map(x=>x*(.8+.4*rr[0])))];b.d=null;}
  else{const u=(i-BW+.5)/(N-2*BW),v=(j-BW+.5)/(N-2*BW);
    b.cols=[0,1,2,3].map(k=>lin(scene(k,u,v,rr)));
    b.d=[4*(u*.55+v*.45)+rnd()*.35, 3.6*clamp((fbm(u*3+2,v*3+7)-.25)*2,0,1)+rnd()*.5, 3.8*(1-v)+rnd()*.4];}
  BG.push(b);
}
const COUNT=1+BG.length+POOL, INST=new Float32Array(COUNT*16);
function put(o,p,q,s,c,shine,glass,sd){const a=o*16;
  INST[a]=p[0];INST[a+1]=p[1];INST[a+2]=p[2];INST[a+3]=sd;
  INST[a+4]=q[0];INST[a+5]=q[1];INST[a+6]=q[2];INST[a+7]=q[3];
  INST[a+8]=s[0];INST[a+9]=s[1];INST[a+10]=s[2];INST[a+11]=shine;
  INST[a+12]=c[0];INST[a+13]=c[1];INST[a+14]=c[2];INST[a+15]=glass;}
const MORTAR=lin(hex('#2a2622'));
function update(t){
  let o=0;
  put(o++,[0,0,-.35],qId,[N+1.6,N+1.6,.7],MORTAR,.05,0,0);
  for(const b of BG){
    let col=b.cols[0],q=b.q,z=b.z;
    if(b.d){let k=-1,p=0;
      for(let m=0;m<3;m++){const pm=clamp((t-T[m]-b.d[m])/.9,0,1);if(pm>0){k=m;p=pm;}}
      if(k>=0){if(p>=1)col=b.cols[k+1];
        else{col=p<.5?b.cols[k]:b.cols[k+1];q=qMul(qAxis(...FLIP[k],Math.PI*p),b.q);z+=Math.sin(Math.PI*p)*.8;}}}
    put(o++,[b.x,b.y,z],q,[b.sx,b.sy,b.sz],col,b.shine,1,b.seed);
  }
  for(let i=0;i<POOL;i++){const s=poolState(i,t);
    if(!s){put(o++,[0,0,-5],qId,[0,0,0],MORTAR,0,1,0);continue;}
    const g=s.g==null?1:s.g;
    put(o++,s.p,s.q,[TS*g,TS*g,s.sz*g],s.col,s.shine,1,i*.013+.5);}
}

// ---------------------------------------------------------------- GL objects
const pMain=mkProg(VS,FS),pDepth=mkProg(VS,FS_DEPTH);
const U={};for(const n of ['uVP','uLVP','uSh','uL','uLC','uEye','uSkyA','uSkyB','uAmb'])U[n]=gl.getUniformLocation(pMain,n);
const UD=gl.getUniformLocation(pDepth,'uVP');
const geo=buildTile(),VC=geo.length/9;
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,geo,gl.STATIC_DRAW);
for(let a=0;a<3;a++){gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,a*12);}
const ib=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferData(gl.ARRAY_BUFFER,INST.byteLength,gl.DYNAMIC_DRAW);
for(let a=0;a<4;a++){gl.enableVertexAttribArray(3+a);gl.vertexAttribPointer(3+a,4,gl.FLOAT,false,64,a*16);gl.vertexAttribDivisor(3+a,1);}
const SM=2048,stex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,stex);
gl.texStorage2D(gl.TEXTURE_2D,1,gl.DEPTH_COMPONENT24,SM,SM);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
const sfb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,sfb);
gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,stex,0);
gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
gl.enable(gl.DEPTH_TEST);

// ---------------------------------------------------------------- frame
const seasonF=t=>T.reduce((s,x)=>s+sstep(x,x+4.5,t),0);
function sp(sf,key){const a=Math.floor(sf),b=Math.min(3,a+1),f=sf-a,A=S[a][key],B=S[b][key];
  return typeof A=='number'?A+(B-A)*f:mix(lin(hex(A)),lin(hex(B)),f);}
function render(t){
  update(t);
  gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,INST);
  const sf=seasonF(t),el=sp(sf,'el'),az=sp(sf,'az')+.25*Math.sin(t*.08);
  const L=[Math.cos(el)*Math.cos(az),Math.cos(el)*Math.sin(az),Math.sin(el)];
  const LVP=M4.mul(M4.ortho(-56,56,-56,56,20,180),M4.look(L.map(x=>x*95),[0,0,0],[0,1,0]));
  // shadow pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,sfb);gl.viewport(0,0,SM,SM);gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(pDepth);gl.uniformMatrix4fv(UD,false,LVP);
  gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(2,4);
  gl.drawArraysInstanced(gl.TRIANGLES,0,VC,COUNT);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  // main pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(.035,.032,.04,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const asp=cv.width/cv.height,fov=30*Math.PI/180,tf=Math.tan(fov/2);
  const yaw=.22*Math.sin(t*2*Math.PI/DUR)+.04*Math.sin(t*.19),pitch=.48+.05*Math.sin(t*.09);
  const need=46,dist=Math.max(need/tf,need/(tf*asp))*(1-.06*Math.sin(t*.07)**2);
  const eye=[dist*Math.sin(yaw)*Math.sin(pitch),-dist*Math.cos(yaw)*Math.sin(pitch),dist*Math.cos(pitch)];
  const VP=M4.mul(M4.persp(fov,asp,1,dist+200),M4.look(eye,[0,-1.5,0],[0,0,1]));
  gl.useProgram(pMain);
  gl.uniformMatrix4fv(U.uVP,false,VP);gl.uniformMatrix4fv(U.uLVP,false,LVP);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,stex);gl.uniform1i(U.uSh,0);
  gl.uniform3fv(U.uL,L);gl.uniform3fv(U.uLC,sp(sf,'lc').map(x=>x*1.25));gl.uniform3fv(U.uEye,eye);
  gl.uniform3fv(U.uSkyA,sp(sf,'skyT'));gl.uniform3fv(U.uSkyB,sp(sf,'skyH'));gl.uniform1f(U.uAmb,sp(sf,'amb'));
  gl.drawArraysInstanced(gl.TRIANGLES,0,VC,COUNT);
}

// ---------------------------------------------------------------- playback and captions
const $=id=>document.getElementById(id);
const freeze=Q.has('freeze');
let off=(+Q.get('t')||0)%DUR,base=performance.now(),paused=false,pauseT=0,shownSeason=-1;
const curT=()=>freeze?off:paused?pauseT:((performance.now()-base)/1000+off)%DUR;
function seek(t){off=((t%DUR)+DUR)%DUR;base=performance.now();pauseT=off;}
cv.addEventListener('click',()=>{if(paused){seek(pauseT);paused=false;}else{pauseT=curT();paused=true;}});
addEventListener('keydown',e=>{
  if(e.key=='ArrowRight')seek(curT()+5);else if(e.key=='ArrowLeft')seek(curT()-5);
  else if(e.key=='r'||e.key=='R')seek(0);else if(e.key==' '){e.preventDefault();cv.click();}});
function resize(){const d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);}
addEventListener('resize',resize);resize();
const SEAS_T=[4.6,19.4,39.4,59.4];
function captions(t){
  $('title').style.opacity=sstep(.3,1.3,t)*(1-sstep(3.6,4.8,t));
  $('fade').style.opacity=Math.max(1-sstep(0,.8,t),sstep(78.6,79.9,t));
  $('bar').style.width=(t/DUR*100)+'%';
  const k=t<T[0]?0:t<T[1]?1:t<T[2]?2:3;
  if(k!=shownSeason){shownSeason=k;$('season').innerHTML=S[k].name+'<span>'+S[k].en+'</span>';}
  const s0=SEAS_T[k];$('season').style.opacity=sstep(s0,s0+1,t)*(1-sstep(s0+6,s0+7.5,t));
}
function loop(){const t=curT();try{render(t);}catch(e){console.error(e);$('title').textContent=String(e);$('title').style.opacity=1;return;}
  captions(t);if(!freeze||++frames<4)requestAnimationFrame(loop);}
let frames=0;
requestAnimationFrame(loop);
</script>
</body></html>
