<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dohyo</title>
<style>
html,body{margin:0;height:100%;background:#07060c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:min(96vw,960px);height:auto;background:#000}
p{margin:0;color:#b7a9c9;font:13px/1.4 ui-monospace,Consolas,monospace}
</style></head><body>
<canvas id="c" width="240" height="135"></canvas>
<p id="cap"></p>
<script>
const PAL = ["#f3e2c2", "#e7c98a", "#c9843a", "#8a4e22", "#5c3018", "#f7f1e4", "#d9d0c2", "#2a241c", "#1a1612", "#e8b89a", "#a85a3a", "#f2f2f2", "#c83a2a", "#6a8a3a", "#d7c07a", "#8d8d92", "#4a4038", "#fff6ea", "#b7b7bc", "#3a2a22", "#e6d3b0", "#7a5230", "#f0d0b0", "#111111"];
const cap = document.getElementById("cap");
const c = document.getElementById("c");
const g = c.getContext("2d");
const img = g.createImageData(240, 135);
const pix = new Uint8Array(240*135);
function set(x,y,i){ if(x<0||y<0||x>=240||y>=135) return; pix[y*240+x]=i; }
function rect(x,y,w,h,i){ for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) set(x+xx,y+yy,i); }
function circ(x,y,r,i){ for(let yy=-r;yy<=r;yy++) for(let xx=-r;xx<=r;xx++) if(xx*xx+yy*yy<=r*r) set(x+xx,y+yy,i); }

function drawWorld(state,t){
  rect(0,0,240,135,0);
  circ(120,92,70,1);
  circ(120,92,62,5);
  rect(70,88,100,4,7);
  for(let i=0;i<16;i++){
    const x=16+(i%8)*28, y=i<8?8:118;
    rect(x,y,8,10, i%2?8:16);
    set(x+3,y+2,17);
  }
}
function drawActor(state,t){
  const x=108, lean = state==="action"? 6 : 0;
  const y = 70 + (state==="idle" && (t%30)<15 ? 1 : 0);
  circ(x+12-lean, y, 8, 9);
  rect(x+8-lean, y-2, 3, 2, 8);
  rect(x+14-lean, y-2, 3, 2, 8);
  rect(x-lean, y+8, 28, 18, 10);
  rect(x+2-lean, y+24, 8, 8, 9);
  rect(x+16-lean, y+24, 8, 8, 9);
  rect(x-6, y+14, 6, 4, 10);
  if(state==="charge"){
    for(let i=0;i<8;i++) set(x-10-i, y+6-(i%3), 11);
  }
  if(state==="action"){
    rect(x+26, y+10, 16, 6, 9);
    rect(x+40, y+8, 8, 8, 12);
  }
}
function onAction(){ burst(150,86,22,11); }

const parts = [];
function burst(x,y,n,col){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*2.2,vy:-Math.random()*1.8-.2,life:20+Math.random()*20,c:col}); }
let f=0, shake=0;
function frame(){
  f++;
  const t = f % 220;
  let state = "idle";
  if (t>90 && t<=140) state="charge";
  else if (t>140) state="action";
  if (t===141) onAction();
  shake = state==="action" ? ((t*3)&1) : 0;
  pix.fill(0);
  drawWorld(state, t);
  drawActor(state, t);
  for (let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    set(p.x|0, p.y|0, p.c);
    if (p.life<=0) parts.splice(i,1);
  }
  const d=img.data;
  for (let i=0;i<pix.length;i++){
    const col=PAL[pix[i]];
    d[i*4]=parseInt(col.slice(1,3),16);
    d[i*4+1]=parseInt(col.slice(3,5),16);
    d[i*4+2]=parseInt(col.slice(5,7),16);
    d[i*4+3]=255;
  }
  g.putImageData(img, shake, 0);
  cap.textContent = state + "  ·  " + PAL.length + " colors";
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
