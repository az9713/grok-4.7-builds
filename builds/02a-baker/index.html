<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Warm Kitchen</title>
<style>
html,body{margin:0;background:#111;color:#eee;font:14px Segoe UI,sans-serif}
#stage{width:1280px;height:720px;position:relative;overflow:hidden}
#ui{display:flex;gap:10px;align-items:center;width:1256px;padding:8px 12px;background:#1c1916}
button{background:#f2c14e;border:0;padding:6px 12px;font-weight:700;cursor:pointer}
input{flex:1}
.cap{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(10,10,14,.86);display:flex;align-items:center;justify-content:center}
.cap span{margin:0 7px;font:700 32px Trebuchet MS,sans-serif;color:#f4efe6}
.cap span.on{color:#ffd83d}
</style></head><body>
<div id="stage"></div>
<div id="ui"><button id="play">Play</button><input id="scrub" type="range" min="0" max="150" step="0.05" value="0"><span id="clock">0.0s</span></div>
<audio id="audio" src="assets/score.wav" preload="auto"></audio>
<script src="../../vendor/p5.min.js"></script>
<script src="../../vendor/p5.brush.js"></script>
<script src="lib.js"></script>
<script src="assets/timing.js"></script>
<script src="film.js"></script>
<script>
let playing=false, playhead=0;
const audio=document.getElementById('audio');
const scrub=document.getElementById('scrub');
function setup(){
  const cnv=createCanvas(1280,720,WEBGL);
  cnv.parent('stage');
  brush.instance(this);
  brush.load();
  if (typeof brush.scaleBrushes==='function') brush.scaleBrushes(1.6);
  noLoop();
  window.studioReady=true;
  if(!window.RENDER) loop();
}
function drawFrame(time){
  Kit.begin(time);
  background(Kit.PAL.paper);
  push(); translate(-640,-360,0);
  drawFilm(time);
  pop();
  const cap=document.querySelector('.cap')||Object.assign(document.createElement('div'),{className:'cap'});
  if(!cap.parentNode) document.getElementById('stage').appendChild(cap);
  const line=lineAt(time);
  cap.innerHTML = line ? line.words.map((w,i)=>`<span class="${time>=w.t0?'on':''}">${w.text}</span>`).join('') : '';
}
function draw(){ if(window.RENDER) return; if(playing) playhead=audio.currentTime||playhead; drawFrame(playhead); document.getElementById('clock').textContent=playhead.toFixed(1)+'s'; scrub.value=playhead; }
window.renderFrame=function(time){ const a=performance.now(); drawFrame(time); return performance.now()-a; };
document.getElementById('play').onclick=()=>{ if(window.RENDER) return; playing=!playing; if(playing) audio.play(); else audio.pause(); };
scrub.oninput=()=>{ playhead=+scrub.value; audio.currentTime=playhead; drawFrame(playhead); };
</script>
</body></html>
