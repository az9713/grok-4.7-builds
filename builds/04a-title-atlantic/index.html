<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORTH ATLANTIC</title>
<style>
html,body{margin:0;height:100%;background:#061018;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"), g=c.getContext("2d");
let W,H,t0=performance.now();
function fit(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener("resize",fit); fit();
const specks=Array.from({length:80},(_,i)=>({x:Math.random(),y:Math.random(),s:Math.random()*1.4+0.2,p:Math.random()*6}));
function frame(now){
  const t=Math.min(15,(now-t0)/1000);
  const w=innerWidth,h=innerHeight;
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,"#0b1c2c"); sky.addColorStop(0.55,"#16344a"); sky.addColorStop(1,"#0e2433");
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  const horizon=h*0.58;
  for(let i=0;i<6;i++){
    g.beginPath();
    const y=horizon+i*h*0.06;
    g.moveTo(0,y);
    for(let x=0;x<=w;x+=12){
      const swell=Math.sin(x*0.01+t*0.7+i)* (8+i*3) + Math.sin(x*0.03-t*1.1+i)*4;
      g.lineTo(x,y+swell);
    }
    g.lineTo(w,h); g.lineTo(0,h); g.closePath();
    g.fillStyle=`rgba(${8+i*6},${28+i*10},${42+i*8},${0.35+i*0.1})`;
    g.fill();
  }
  g.globalAlpha=0.35;
  specks.forEach(s=>{
    const x=((s.x*w+t*40*(0.3+s.s))%(w+20))-10;
    const y=s.y*horizon*0.9;
    g.fillStyle="#d5e4ee";
    g.fillRect(x,y,s.s,s.s);
  });
  g.globalAlpha=1;
  const reveal=Math.max(0,Math.min(1,(t-3.2)/2.4));
  g.save();
  g.globalAlpha=reveal;
  g.fillStyle="#e7eef3";
  g.font=`${Math.min(w*0.072,86)}px "Palatino Linotype", Palatino, "Times New Roman", serif`;
  g.textAlign="center"; g.textBaseline="middle";
  g.fillText("NORTH ATLANTIC", w/2, h*0.28);
  g.restore();
  if(t<15) requestAnimationFrame(frame);
  else { t0=performance.now(); requestAnimationFrame(frame); }
}
requestAnimationFrame(frame);
</script></body></html>
