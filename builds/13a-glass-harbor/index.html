<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Glass</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl2",{antialias:false});
const COLS=96, ROWS=54, N=COLS*ROWS;
const vs=`#version 300 es
layout(location=0) in vec2 corner;
layout(location=1) in vec2 origin;
layout(location=2) in float seed;
uniform vec2 res;
uniform float time;
out vec3 vCol;
float hash(float n){ return fract(sin(n*127.1)*43758.5453); }
void main(){
  float dur=80.0;
  float u=origin.x, v=origin.y;
  float phase=mod(time,dur)/dur;
  float day=smoothstep(0.45,0.7,phase);
  vec3 sky=mix(vec3(0.55,0.72,0.82), vec3(0.05,0.08,0.16), day);
  vec3 water=mix(vec3(0.20,0.45,0.55), vec3(0.02,0.08,0.14), day);
  vec3 col=v>0.62? water : sky;
  float ferry=smoothstep(0.02,0.0,abs(v-0.60))*smoothstep(0.08,0.0,abs(u-(0.25+phase*0.4)));
  col=mix(col, vec3(0.85,0.82,0.75), ferry);
  float gull=0.0;
  for(int i=0;i<3;i++){
    float fi=float(i);
    vec2 gp=vec2(fract(0.15*fi+phase*1.4), 0.28+0.08*sin(phase*12.0+fi));
    gull=max(gull, smoothstep(0.015,0.0,length(vec2(u,v)-gp)));
  }
  col=mix(col, vec3(0.95), gull);
  float lantern=day*smoothstep(0.03,0.0,length(vec2(u,v)-vec2(fract(0.2+phase),0.58)));
  col=mix(col, vec3(1.0,0.72,0.25), lantern);
  float burst=abs(sin(phase*3.14159*4.0));
  float scatter=(hash(seed)-0.5)*burst*0.08;
  vec2 pos=origin+vec2(scatter, scatter*0.6)+corner/vec2(float(${COLS}), float(${ROWS}));
  vec2 clip=pos*2.0-1.0; clip.y=-clip.y;
  gl_Position=vec4(clip,0.0,1.0);
  vCol=col;
}`;
const fs=`#version 300 es
precision mediump float;
in vec3 vCol; out vec4 o;
void main(){ o=vec4(vCol,1.0); }`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog); gl.useProgram(prog);
const corners=new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
const origins=new Float32Array(N*2), seeds=new Float32Array(N);
for(let i=0;i<N;i++){ origins[i*2]= (i%COLS)/COLS; origins[i*2+1]=(i/COLS|0)/ROWS; seeds[i]=i+1; }
function buf(loc,data,size,div){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);gl.vertexAttribDivisor(loc,div);}
buf(0,corners,2,0); buf(1,origins,2,1); buf(2,seeds,1,1);
const uTime=gl.getUniformLocation(prog,"time");
const t0=performance.now();
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;gl.viewport(0,0,canvas.width,canvas.height);}
addEventListener("resize",resize); resize();
function frame(now){ gl.uniform1f(uTime,(now-t0)/1000); gl.drawArraysInstanced(gl.TRIANGLES,0,6,N); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script></body></html>
