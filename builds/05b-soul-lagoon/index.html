<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Lagoon Dish</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07080c;color:#f3ecdf;font:16px Georgia,serif}
#ui{position:fixed;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
#banner{position:fixed;left:0;right:0;top:18%;text-align:center;font-size:42px;letter-spacing:2px;opacity:0;transition:opacity .4s}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,6,10,.72)}
button{pointer-events:auto;background:#f3ecdf;color:#1a1612;border:0;padding:10px 16px;font:inherit;cursor:pointer}
</style></head><body>
<div id="title"><h1>Lagoon Dish</h1><p>Noon on a coral lagoon. A canvas-suit diver and a knife. Creatures, not knights. Rest at the generator sheds.</p><button id="start">Enter</button></div>
<div id="banner"></div>
<div id="ui"><div id="hp">HP 100</div><div id="where"></div><div>J attack · K dodge · L block · E rest</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const AREAS = [{"name": "Dish Rim", "x": 0, "z": 0, "w": 9, "d": 9, "color": "#d7efe8", "rest": [0, 3], "enemies": [[3, -2]]}, {"name": "Control Hut", "x": 0, "z": -14, "w": 7, "d": 7, "color": "#efe6d2", "rest": [0, -14], "enemies": [[2, -16], [-2, -12]]}, {"name": "Cable Trench", "x": 12, "z": -8, "w": 6, "d": 12, "color": "#2a6a58", "rest": [12, -4], "enemies": [[12, -12]]}];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color("#9fd0ea"); scene.fog=new THREE.Fog("#9fd0ea", 8, 28);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 80);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223, 1.1));
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.7,4,8), new THREE.MeshStandardMaterial({color:"#e7d2a8"}));
body.position.y=0.7; player.add(body);
const weapon=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,0.08), new THREE.MeshStandardMaterial({color:0xddd6c8}));
weapon.position.set(0.35,0.8,0.2); player.add(weapon); scene.add(player);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({color:"#12343a", roughness:1}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const foes=[];
AREAS.forEach(a=>{
  const floor=new THREE.Mesh(new THREE.BoxGeometry(a.w,0.2,a.d), new THREE.MeshStandardMaterial({color:a.color}));
  floor.position.set(a.x,-0.05,a.z); scene.add(floor);
  const rest=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.9,0.6), new THREE.MeshStandardMaterial({color:0xc4552a}));
  rest.position.set(a.rest[0],0.45,a.rest[1]); rest.userData.rest=a; scene.add(rest);
  a.enemies.forEach(p=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(0.35,12,8), new THREE.MeshStandardMaterial({color:0x6a2030}));
    e.position.set(p[0],0.4,p[1]); e.userData.home=e.position.clone(); e.userData.hp=3; scene.add(e); foes.push(e);
  });
});
const keys={}; addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true); addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let hp=100, checkpoint=new THREE.Vector3(AREAS[0].rest[0],0,AREAS[0].rest[1]), area=AREAS[0], dodge=0, attack=0, block=false, started=false;
const banner=document.getElementById("banner");
function toast(t){ banner.textContent=t; banner.style.opacity=1; setTimeout(()=>banner.style.opacity=0, 1400); }
function enterArea(a){ if(area===a) return; area=a; toast(a.name); document.getElementById("where").textContent=a.name; }
function restAt(a){ hp=100; checkpoint.set(a.rest[0],0,a.rest[1]); foes.forEach(f=>{f.userData.hp=3; f.position.copy(f.userData.home); f.visible=true;}); toast("Rested"); }
function die(){ hp=100; player.position.copy(checkpoint); toast("Returned"); }
document.getElementById("start").onclick=()=>{ started=true; document.getElementById("title").remove(); toast(AREAS[0].name); player.position.set(AREAS[0].rest[0],0,AREAS[0].rest[1]); };
addEventListener("keydown", e=>{
  if(!started) return;
  if(e.key.toLowerCase()==="j") attack=0.25;
  if(e.key.toLowerCase()==="k") dodge=0.28;
  if(e.key.toLowerCase()==="l") block=true;
  if(e.key.toLowerCase()==="e"){
    const r=AREAS.find(a=>Math.hypot(player.position.x-a.rest[0], player.position.z-a.rest[1])<1.3);
    if(r) restAt(r);
  }
});
addEventListener("keyup", e=>{ if(e.key.toLowerCase()==="l") block=false; });
const yaw={v:0};
function tick(){
  if(started){
    const speed=dodge>0?0.11:0.05;
    if(keys["w"]) player.position.z-=speed;
    if(keys["s"]) player.position.z+=speed;
    if(keys["a"]){ player.position.x-=speed; yaw.v=0.4; }
    if(keys["d"]){ player.position.x+=speed; yaw.v=-0.4; }
    player.rotation.y += (yaw.v-player.rotation.y)*0.2;
    if(attack>0){ weapon.rotation.z=-1.2; attack-=0.016; } else weapon.rotation.z=0;
    if(dodge>0) dodge-=0.016;
    AREAS.forEach(a=>{ if(Math.abs(player.position.x-a.x)<a.w/2 && Math.abs(player.position.z-a.z)<a.d/2) enterArea(a); });
    foes.forEach(f=>{
      if(!f.visible) return;
      const dx=player.position.x-f.position.x, dz=player.position.z-f.position.z, dist=Math.hypot(dx,dz);
      if(dist<6){ f.position.x+=dx/dist*0.02; f.position.z+=dz/dist*0.02; }
      if(dist<0.8 && dodge<=0){ hp -= block? 0.15 : 0.6; }
      if(attack>0.15 && dist<1.3){ f.userData.hp--; if(f.userData.hp<=0) f.visible=false; attack=0; }
    });
    if(hp<=0) die();
    document.getElementById("hp").textContent="HP "+Math.max(0,hp|0);
  }
  const back=new THREE.Vector3(0,2.2,4.2).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y);
  camera.position.copy(player.position).add(back);
  camera.lookAt(player.position.x, 1, player.position.z);
  renderer.render(scene,camera); requestAnimationFrame(tick);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
tick();
</script></body></html>
