<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Night Shift</title>
<style>
html,body{margin:0;height:100%;background:#e7dcc8;color:#24180f;font:16px Georgia,serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab}
#cap{position:fixed;left:24px;bottom:18px;background:#f7f1e6;padding:6px 10px}
#photo{position:fixed;right:18px;bottom:18px;width:140px;height:105px;object-fit:cover;border:6px solid #f7f1e6;box-shadow:0 8px 18px rgba(0,0,0,.25)}
</style></head><body>
<canvas id="c"></canvas>
<img id="photo" alt="">
<div id="cap"></div>
<script>
const FILES = ["nurses-station.jpg", "corridor.jpg", "vending-machine.jpg", "visitor.jpg", "sink.jpg", "ambulance-bay.jpg"];
const c=document.getElementById("c"), g=c.getContext("2d");
const photo=document.getElementById("photo"), cap=document.getElementById("cap");
let page=0, curl=0, drag=null;
const cache=new Map();
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",fit); fit();
function load(src){
  if(cache.has(src)) return Promise.resolve(cache.get(src));
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{ cache.set(src,im); res(im); };
    im.onerror=()=>rej(new Error(src));
    im.src="photos/"+src;
  });
}
function redraw(im){
  const w=innerWidth,h=innerHeight;
  g.fillStyle="#f4ead8"; g.fillRect(0,0,w,h);
  const oc=document.createElement("canvas");
  oc.width=160; oc.height=110;
  const og=oc.getContext("2d",{willReadFrequently:true});
  og.drawImage(im,0,0,160,110);
  const data=og.getImageData(0,0,160,110).data;
  const ox=(w-160*4)/2, oy=(h-110*4)/2;
  g.lineCap="round";
  for(let y=0;y<110;y+=2){
    for(let x=0;x<160;x+=2){
      const i=(y*160+x)*4;
      const lum=(data[i]+data[i+1]+data[i+2])/3;
      const ink=1-lum/255;
      if(ink<0.18) continue;
      g.strokeStyle=`rgba(40,28,20,${0.25+ink*0.65})`;
      g.lineWidth=0.6+ink*2.2;
      g.beginPath();
      g.moveTo(ox+x*4, oy+y*4);
      g.lineTo(ox+x*4+6, oy+y*4+(ink>0.55?1:0));
      g.stroke();
    }
  }
  // edge pass so faces stay faces
  for(let y=1;y<109;y+=2){
    for(let x=1;x<159;x+=2){
      const i=(y*160+x)*4, r=(y*160+x+1)*4;
      const a=(data[i]+data[i+1]+data[i+2])/3;
      const b=(data[r]+data[r+1]+data[r+2])/3;
      if(Math.abs(a-b)>28){
        g.strokeStyle="#1a120c"; g.lineWidth=1.1;
        g.beginPath(); g.moveTo(ox+x*4, oy+y*4); g.lineTo(ox+x*4, oy+y*4+4); g.stroke();
      }
    }
  }
}
function curlShade(){
  if(curl<=0.001) return;
  const w=innerWidth,h=innerHeight;
  g.save();
  g.beginPath();
  g.moveTo(w,0);
  g.quadraticCurveTo(w-curl*w, h*0.5, w, h);
  g.lineTo(w,0);
  g.fillStyle="rgba(90,60,30,0.18)";
  g.fill();
  g.restore();
}
async function show(){
  const name=FILES[page];
  cap.textContent=name;
  photo.src="photos/"+name;
  try{
    const im=await load(name);
    redraw(im); curlShade();
  }catch(e){
    g.fillStyle="#f4ead8"; g.fillRect(0,0,innerWidth,innerHeight);
    g.fillStyle="#24180f"; g.font="22px Georgia";
    g.fillText("Missing "+name, 40, 80);
  }
}
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ page=(page+1)%FILES.length; curl=0.2; show(); }
  if(e.key==="ArrowLeft"){ page=(page-1+FILES.length)%FILES.length; curl=0.2; show(); }
});
c.addEventListener("pointerdown",e=>{ drag=e.clientX; c.setPointerCapture(e.pointerId); });
c.addEventListener("pointermove",e=>{
  if(drag==null) return;
  curl=Math.min(1,Math.abs(e.clientX-drag)/innerWidth);
  show();
});
c.addEventListener("pointerup",e=>{
  if(drag!=null && e.clientX-drag<-80) page=(page+1)%FILES.length;
  if(drag!=null && e.clientX-drag>80) page=(page-1+FILES.length)%FILES.length;
  drag=null; curl=0; show();
});
show();
</script></body></html>
