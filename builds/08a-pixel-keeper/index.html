<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pier Keeper</title>
<style>
html,body{margin:0;height:100%;background:#07060c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:min(96vw,960px);height:auto;background:#000}
p{margin:0;color:#b7a9c9;font:13px/1.4 ui-monospace,Consolas,monospace}
</style></head><body>
<canvas id="c" width="240" height="135"></canvas>
<p id="cap"></p>
<script>
const PAL = ["#07060f", "#140e28", "#2a2150", "#d9d4ea", "#3a3a44", "#6a6a74", "#1b1b22", "#6d4a2e", "#e2c39a", "#ffb45a", "#ffe1a3", "#0c3144", "#18485f", "#f4f1ff", "#ff7a2a", "#8a5a28", "#c9a06a", "#1a120c", "#4d6a78", "#9bb0b8", "#221828", "#5a4030", "#f2d48a", "#0a0a10"];
const cap = document.getElementById("cap");
const c = document.getElementById("c");
const g = c.getContext("2d");
const img = g.createImageData(240, 135);
const pix = new Uint8Array(240*135);
function set(x,y,i){ if(x<0||y<0||x>=240||y>=135) return; pix[y*240+x]=i; }
function rect(x,y,w,h,i){ for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) set(x+xx,y+yy,i); }
function circ(x,y,r,i){ for(let yy=-r;yy<=r;yy++) for(let xx=-r;xx<=r;xx++) if(xx*xx+yy*yy<=r*r) set(x+xx,y+yy,i); }

function drawWorld(state,t){
  for(let y=0;y<78;y++) rect(0,y,240,1, y<40?1:2);
  circ(188,28,16,3);
  for(let i=0;i<28;i++){ const x=(i*47+11)%230, y=(i*19)%36; set(x,y,13); }
  rect(0,78,240,57,4);
  for(let x=0;x<240;x+=8){ rect(x,78,1,57,5); rect(x+1,100,6,2,6); }
  rect(0,108,240,27,11);
  for(let x=0;x<240;x+=6) set(x,112+((x+t)%5),12);
}
function drawActor(state,t){
  const bob = state==="idle" ? (t%40<20?0:1) : 0;
  const x=96, y=62+bob;
  rect(x+6,y,10,8,8); rect(x+8,y+2,2,2,17); rect(x+12,y+2,2,2,17);
  if ((t%80)>70) rect(x+8,y+2,6,2,8);
  rect(x+4,y+8,16,14,7);
  rect(x+2,y+20,8,8,15); rect(x+14,y+20,8,8,16);
  rect(x+18,y+8,4,10,7);
  const glow = state==="idle"?9:10;
  circ(x+28,y+6,3,glow);
  rect(x+27,y+6,2,8,16);
  if(state!=="idle"){
    const len = state==="charge" ? 10+(t%20) : 70;
    for(let i=0;i<len;i++){
      const yy = y+4 + ((i%3)-1);
      set(x+32+i, yy, i%4===0?14:10);
      if(state==="action") set(x+32+i, yy+2, 11);
    }
  }
}
function onAction(){ burst(150,68,18,14); burst(160,74,10,10); }

const parts = [];
function burst(x,y,n,col){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*2.2,vy:-Math.random()*1.8-.2,life:20+Math.random()*20,c:col}); }
let f=0, shake=0;
function frame(){
  f++;
  const t = f % 220;
  let state = "idle";
  if (t>90 && t<=140) state="charge";
  else if (t>140) state="action";
  if (t===141) onAction();
  shake = state==="action" ? ((t*3)&1) : 0;
  pix.fill(0);
  drawWorld(state, t);
  drawActor(state, t);
  for (let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    set(p.x|0, p.y|0, p.c);
    if (p.life<=0) parts.splice(i,1);
  }
  const d=img.data;
  for (let i=0;i<pix.length;i++){
    const col=PAL[pix[i]];
    d[i*4]=parseInt(col.slice(1,3),16);
    d[i*4+1]=parseInt(col.slice(3,5),16);
    d[i*4+2]=parseInt(col.slice(5,7),16);
    d[i*4+3]=255;
  }
  g.putImageData(img, shake, 0);
  cap.textContent = state + "  ·  " + PAL.length + " colors";
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
