<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night street, a camera</title>
<style>
html,body{margin:0;height:100%;background:#0e1116;color:#e8e0d4;font:15px/1.4 Georgia,serif;overflow:hidden}
#c{position:fixed;inset:0}
#panel{position:fixed;left:16px;top:16px;width:280px;background:rgba(12,14,18,.86);padding:14px 16px;border:1px solid #3a342c}
h1{font-size:20px;margin:0 0 8px;font-weight:500}
button,label{display:block;margin:6px 0}
button{background:#e8e0d4;color:#1a1612;border:0;padding:6px 8px;font:inherit;cursor:pointer}
button.on{background:#c4552a;color:#fff}
small{color:#b7aa98}
input[type=range]{width:100%}
</style></head><body>
<div id="panel">
  <h1>Night street, a camera</h1>
  <small id="fact"></small>
  <label>Focus <input id="focus" type="range" min="0.4" max="18" step="0.01" value="4"></label>
  <div id="stops"></div>
  <button id="explode">Exploded view</button>
  <button id="fix">Filter the fringe</button>
  <small>Drag to orbit. Keys 1 2 3 pick a stop. E explodes. F toggles the correction.</small>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const CFG = {"bg": "#070b14", "focal": 50, "coc": 0.03, "defect": 3.2, "blurb": "A 50 mm lens on a night bench. Neon, a parked car, and a tower sit at three distances.", "stops": [{"label": "f/2", "n": 2}, {"label": "f/5.6", "n": 5.6}, {"label": "f/16", "n": 16}], "subjects": [{"name": "neon sign", "color": "#ff4d6a", "x": -2.2, "y": 1.1, "z": 1.2, "w": 0.9, "h": 0.45}, {"name": "parked car", "color": "#3a4a62", "x": 0.2, "y": 0.45, "z": 4.0, "w": 1.6, "h": 0.7}, {"name": "tower", "color": "#9bb0c4", "x": 2.0, "y": 1.6, "z": 12, "w": 0.4, "h": 2.2}]};
const fact = document.getElementById("fact");
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.domElement.id = "c";
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.bg);
scene.fog = new THREE.Fog(CFG.bg, 12, 36);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 80);
camera.position.set(4.2, 1.6, 6.5);
const look = new THREE.Vector3(0, 0.4, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xfff1d6, 1.4);
key.position.set(4, 8, 2); scene.add(key);
const bench = new THREE.Group(); scene.add(bench);
const rail = new THREE.Mesh(new THREE.BoxGeometry(8, 0.08, 0.35), new THREE.MeshStandardMaterial({color:0x2a3138, metalness:0.6, roughness:0.35}));
bench.add(rail);
function optic(x, radius, thick, color, name){
  const g = new THREE.Group(); g.position.x = x; g.userData.home = x;
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thick, 32), new THREE.MeshPhysicalMaterial({color, roughness:0.05, transmission:0.86, thickness:0.4, transparent:true}));
  glass.rotation.z = Math.PI/2; g.add(glass);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius+0.02, 0.025, 8, 24), new THREE.MeshStandardMaterial({color:0x1a1c20, metalness:0.8, roughness:0.3}));
  ring.rotation.y = Math.PI/2; g.add(ring);
  g.name = name; bench.add(g); return g;
}
const lenses = [
  optic(-1.6, 0.55, 0.16, 0xd7e7f2, "objective"),
  optic(-0.7, 0.42, 0.1, 0xf2e2c8, "element"),
  optic(0.15, 0.28, 0.08, 0xc9d8ea, "stop"),
  optic(1.15, 0.34, 0.12, 0xe7eef6, "eyepiece"),
];
const subjects = CFG.subjects.map(s => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(s.w, s.h), new THREE.MeshStandardMaterial({color:s.color, roughness:0.8}));
  m.position.set(s.x, s.y, s.z); bench.add(m);
  const label = makeLabel(s.name); label.position.set(s.x, s.y+s.h*0.7, s.z); bench.add(label);
  return {mesh:m, z:s.z, name:s.name};
});
function makeLabel(text){
  const c = document.createElement("canvas"); c.width=256; c.height=64;
  const g=c.getContext("2d"); g.fillStyle="#f4efe6"; g.font="28px Georgia"; g.fillText(text, 8, 40);
  const tex=new THREE.CanvasTexture(c);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.28), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
  return m;
}
let focus = 4, stop = CFG.stops[0], exploded = false, fixed = true;
const stopsEl = document.getElementById("stops");
CFG.stops.forEach(s => {
  const b=document.createElement("button"); b.textContent=s.label; b.onclick=()=>setStop(s);
  stopsEl.appendChild(b);
});
function setStop(s){ stop=s; [...stopsEl.children].forEach(b=>b.classList.toggle("on", b.textContent===s.label)); paint(); }
document.getElementById("focus").oninput=e=>{ focus=+e.target.value; paint(); };
document.getElementById("explode").onclick=()=>{ exploded=!exploded; };
document.getElementById("fix").onclick=()=>{ fixed=!fixed; paint(); };
addEventListener("keydown", e=>{
  if(e.key==="1") setStop(CFG.stops[0]);
  if(e.key==="2") setStop(CFG.stops[1]);
  if(e.key==="3") setStop(CFG.stops[2]);
  if(e.key==="e"||e.key==="E") exploded=!exploded;
  if(e.key==="f"||e.key==="F"){ fixed=!fixed; paint(); }
});
let drag=null;
renderer.domElement.addEventListener("pointerdown", e=>{ drag=e.clientX; });
addEventListener("pointerup", ()=>drag=null);
addEventListener("pointermove", e=>{
  if(drag==null) return;
  const dx=(e.clientX-drag)*0.01; drag=e.clientX;
  const p=camera.position.clone().sub(look);
  p.applyAxisAngle(new THREE.Vector3(0,1,0), dx);
  camera.position.copy(look).add(p);
});
function coc(z){
  const N=stop.n, fmm=CFG.focal, cocmm=CFG.coc;
  const miss=Math.abs(z-focus);
  const blur = (fmm*fmm*miss)/(N*cocmm*Math.max(0.2,z)*1000);
  return fixed? blur : blur*CFG.defect;
}
function paint(){
  const sharp = subjects.reduce((a,s)=> coc(Math.abs(s.z))<coc(Math.abs(a.z))?s:a);
  fact.innerHTML = `${CFG.blurb}<br>Focal length ${CFG.focal} mm · circle of confusion ${CFG.coc} mm · stop ${stop.label} (N=${stop.n}).<br>Sharpest subject: ${sharp.name}. Hyperfocal ≈ ${(CFG.focal*CFG.focal/(stop.n*CFG.coc)+CFG.focal).toFixed(0)} mm.`;
  subjects.forEach(s=>{
    const b=Math.min(1, coc(Math.abs(s.z)));
    s.mesh.material.transparent=true;
    s.mesh.material.opacity=1-b*0.45;
    s.mesh.scale.setScalar(1+b*0.35);
  });
}
setStop(CFG.stops[1]);
addEventListener("resize", ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
function tick(){
  lenses.forEach((g,i)=>{
    const home=g.userData.home;
    const target=exploded? home*2.1 : home;
    g.position.x += (target-g.position.x)*0.08;
  });
  camera.lookAt(look);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script></body></html>
