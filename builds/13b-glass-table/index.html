<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table Glass</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl2",{antialias:false});
const COLS=96, ROWS=54, N=COLS*ROWS;
const vs=`#version 300 es
layout(location=0) in vec2 corner;
layout(location=1) in vec2 origin;
layout(location=2) in float seed;
uniform float time;
out vec3 vCol;
float hash(float n){ return fract(sin(n*91.7)*43758.5453); }
float box(vec2 p, vec2 c, vec2 s){ vec2 d=abs(p-c)-s; return length(max(d,0.0)); }
void main(){
  float phase=mod(time,80.0)/80.0;
  float lamp=smoothstep(0.35,0.7,phase);
  vec3 cloth=mix(vec3(0.72,0.62,0.48), vec3(0.28,0.16,0.10), lamp);
  vec2 p=origin;
  vec3 col=cloth;
  col=mix(col, vec3(0.85,0.88,0.9), smoothstep(0.03,0.0,box(p,vec2(0.32,0.58),vec2(0.05,0.07))));
  col=mix(col, vec3(0.55,0.62,0.66), smoothstep(0.03,0.0,box(p,vec2(0.68,0.60),vec2(0.05,0.07))));
  float tear=smoothstep(0.45,0.7,phase);
  col=mix(col, vec3(0.92,0.9,0.82), smoothstep(0.02,0.0,box(p,vec2(0.5,0.5),vec2(0.08,0.05*(1.0-tear)))));
  col=mix(col, vec3(0.15,0.1,0.08), smoothstep(0.004,0.0, abs(p.x-(0.46+tear*0.08))) * step(0.45,p.y)*step(p.y,0.55));
  float hands=smoothstep(0.2,0.5,phase);
  col=mix(col, vec3(0.62,0.42,0.32), hands*smoothstep(0.04,0.0,box(p,vec2(0.22,0.72),vec2(0.08,0.04))));
  col=mix(col, vec3(0.55,0.36,0.28), hands*smoothstep(0.04,0.0,box(p,vec2(0.78,0.74),vec2(0.08,0.04))));
  if(lamp>0.2){
    float d=length(p-vec2(0.5,0.22));
    col+=vec3(1.0,0.72,0.3)*smoothstep(0.25,0.0,d)*lamp;
  }
  float burst=abs(sin(phase*12.56));
  vec2 scatter=(vec2(hash(seed), hash(seed+4.0))-0.5)*burst*0.07;
  vec2 pos=origin+scatter+corner/vec2(float(${COLS}), float(${ROWS}));
  vec2 clip=pos*2.0-1.0; clip.y=-clip.y;
  gl_Position=vec4(clip,0.0,1.0);
  vCol=col;
}`;
const fs=`#version 300 es
precision mediump float; in vec3 vCol; out vec4 o; void main(){ o=vec4(vCol,1.0);} `;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog); gl.useProgram(prog);
const corners=new Float32Array([0,0,1,0,0,1,0,1,1,0,1,1]);
const origins=new Float32Array(N*2), seeds=new Float32Array(N);
for(let i=0;i<N;i++){origins[i*2]=(i%COLS)/COLS; origins[i*2+1]=(i/COLS|0)/ROWS; seeds[i]=i+3;}
function buf(loc,data,size,div){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);gl.vertexAttribDivisor(loc,div);}
buf(0,corners,2,0); buf(1,origins,2,1); buf(2,seeds,1,1);
const uTime=gl.getUniformLocation(prog,"time"); const t0=performance.now();
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;gl.viewport(0,0,canvas.width,canvas.height);} addEventListener("resize",resize); resize();
function frame(now){gl.uniform1f(uTime,(now-t0)/1000); gl.drawArraysInstanced(gl.TRIANGLES,0,6,N); requestAnimationFrame(frame);} requestAnimationFrame(frame);
</script></body></html>
